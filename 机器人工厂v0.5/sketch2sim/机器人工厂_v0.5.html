<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(window!==window.parent)document.documentElement.classList.add("embedded")}catch(e){document.documentElement.classList.add("embedded")}</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui;background:#fafaf9}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Little Robot Factory</title>
<style>
:root{
  color-scheme: light;
  --bg:#DEE5EC; --bg2:#EDF2F7; --panel:#FFFFFF; --panel2:#F3F7FA;
  --ink:#18222D; --muted:#8494A4; --line:#C4D1DC; --line2:#DAE3EB;
  --sun:#FFC531; --coral:#FF6B57; --sky:#2E9BE6; --leaf:#35C07A;
  --shadow:0 2px 0 rgba(22,33,44,.10), 0 8px 22px rgba(22,33,44,.10);
  --shadow-lift:0 3px 0 rgba(22,33,44,.14), 0 14px 30px rgba(22,33,44,.16);
  --stage-a:#F8FBFD; --stage-b:#E1EBF2; --grid:#C9D7E2;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:14px}
svg{display:block}

.app{height:100%;display:grid;gap:12px;padding:12px;
  grid-template-columns:96px minmax(0,1fr) minmax(300px,390px);
  grid-template-rows:minmax(0,1fr) auto;
  grid-template-areas:"rail center side" "dock dock dock"}

/* rail */
.rail{grid-area:rail;display:flex;flex-direction:column;gap:8px;min-height:0}
.mark{height:48px;border-radius:17px;background:var(--panel);box-shadow:var(--shadow);
  display:grid;place-items:center;flex:0 0 auto;color:var(--sun)}
.mark svg{width:28px;height:28px}
.rail-scroll{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;padding-bottom:2px;scrollbar-width:thin}
.cat{flex:0 0 auto;height:58px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);
  display:grid;place-items:center;color:var(--muted);position:relative;
  transition:transform .12s ease,color .12s ease,background .12s ease}
.cat svg{width:27px;height:27px}
.cat:hover{transform:translateY(-2px)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.cat .dot{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel)}

/* centre */
.center{grid-area:center;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.stage{flex:1 1 auto;min-height:0;border-radius:26px;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 8%, var(--stage-a), var(--stage-b));
  box-shadow:var(--shadow);border:1px solid var(--line2)}
.stage svg.hero{position:absolute;inset:12px 12px 8px;width:calc(100% - 24px);height:calc(100% - 20px);z-index:2}
.hit{cursor:pointer}
.hit:hover .lift{transform:translateY(-3px)}
.lift{transition:transform .14s ease}

.tray{flex:0 0 auto;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);
  padding:10px;display:flex;gap:9px;overflow-x:auto;scrollbar-width:thin}
.chip{flex:0 0 auto;width:82px;height:72px;border-radius:18px;background:var(--panel2);
  display:grid;place-items:center;position:relative;color:var(--muted);border:2px solid transparent;
  transition:transform .12s ease,border-color .12s ease,color .12s ease}
.chip svg{width:52px;height:42px}
.chip:hover{transform:translateY(-3px)}
.chip[aria-pressed="true"]{border-color:var(--chipc,var(--sky));color:var(--chipc,var(--sky));background:var(--panel)}
.chip .tick{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;
  background:var(--chipc,var(--sky));color:#fff;display:none;place-items:center;box-shadow:var(--shadow)}
.chip[aria-pressed="true"] .tick{display:grid}
.chip .tick svg{width:13px;height:13px}
.swatch{width:72px;height:72px;border-radius:18px;flex:0 0 auto;border:3px solid var(--panel2);
  position:relative;overflow:hidden;transition:transform .12s ease}
.swatch:hover{transform:translateY(-3px)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.swatch i{position:absolute;inset:0}
.swatch i.b{clip-path:polygon(0 0,100% 0,0 100%)}
.swatch i.w{clip-path:polygon(100% 0,100% 100%,0 100%)}
.swatch .tick{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:var(--panel);display:none;place-items:center;z-index:2}
.swatch[aria-pressed="true"] .tick{display:grid}
.swatch .tick svg{width:11px;height:11px}

/* right side */
.side{grid-area:side;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.scenes{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  background:var(--panel);border-radius:20px;padding:6px;box-shadow:var(--shadow)}
.stab{height:50px;border-radius:15px;display:grid;place-items:center;color:var(--muted);
  background:transparent;transition:background .14s ease,color .14s ease}
.stab svg{width:30px;height:26px}
.stab:hover{background:var(--panel2)}
.stab[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.view{flex:1 1 auto;min-height:180px;border-radius:26px;overflow:hidden;position:relative;
  box-shadow:var(--shadow);border:1px solid var(--line2);background:#0B1220;touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
.view canvas{display:block;width:100%;height:100%}
.spin-hint{position:absolute;left:10px;bottom:10px;width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.72);color:#41505F;display:grid;place-items:center;pointer-events:none}
.spin-hint svg{width:18px;height:18px}
.traits{position:absolute;left:10px;top:10px;z-index:4;display:grid;gap:5px;
  background:rgba(255,255,255,.80);border-radius:14px;padding:8px 9px;box-shadow:var(--shadow)}
.trow{display:grid;grid-template-columns:16px 50px;align-items:center;gap:7px;color:#5A6B7B}
.trow svg{width:15px;height:15px}
.tbar{height:6px;border-radius:3px;background:rgba(90,107,123,.25);overflow:hidden}
.tbar i{display:block;height:100%;border-radius:3px;background:var(--chipc,#2E9BE6);transition:width .35s ease}

.bubble{position:absolute;left:50%;top:12px;translate:-50% 0;z-index:5;background:var(--panel);
  border-radius:22px;padding:9px 11px;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:9px;
  border:2px solid var(--coral);animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;translate:-50% 0;width:16px;height:16px;
  background:var(--panel);border-right:2px solid var(--coral);border-bottom:2px solid var(--coral);rotate:45deg}
.bubble .q{width:24px;height:24px;color:var(--coral)}
.bubble .need{width:52px;height:42px;color:var(--chipc,var(--sky))}
@keyframes pop{from{opacity:0;translate:-50% -8px;scale:.9}to{opacity:1;translate:-50% 0;scale:1}}

.missions{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mcard{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:8px 4px 7px;
  display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);
  border:2px solid transparent;transition:transform .12s ease,border-color .12s ease,color .12s ease}
.mcard:hover{transform:translateY(-3px)}
.mcard[data-state="run"]{border-color:var(--sky);color:var(--sky)}
.mcard[data-state="done"]{border-color:var(--leaf);color:var(--leaf)}
.mcard svg.mi{width:100%;max-width:54px;height:32px}
.stars{display:flex;gap:3px}
.stars svg{width:13px;height:13px;color:var(--line)}
.stars svg.on{color:var(--sun)}

/* dock */
.dock{grid-area:dock;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);
  padding:8px 10px;display:flex;align-items:center;gap:8px;min-height:62px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px))}
.tool{flex:0 0 auto;width:46px;height:46px;border-radius:15px;background:var(--panel2);color:var(--muted);
  display:grid;place-items:center;transition:transform .12s ease,color .12s ease,background .12s ease}
.tool svg{width:23px;height:23px}
.tool:hover{transform:translateY(-2px)}
.tool.accent{background:var(--sun);color:#3A2C05}
.tool.accent2{background:var(--coral);color:#fff}
.tool[data-off="1"]{color:var(--line)}
.sep{width:2px;height:30px;background:var(--line2);border-radius:2px;flex:0 0 auto}
.gallery{display:flex;gap:7px;overflow-x:auto;flex:1 1 auto;min-width:0;align-items:center;padding:2px 0}
.gslot{flex:0 0 auto;width:44px;height:46px;border-radius:13px;background:var(--panel2);
  position:relative;display:grid;place-items:center;transition:transform .12s ease}
.gslot:hover{transform:translateY(-2px)}
.gslot svg{width:100%;height:100%}
.gslot .x{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;
  background:var(--ink);color:var(--panel);display:none;place-items:center;z-index:2}
.gslot:hover .x{display:grid}
.gslot .x svg{width:9px;height:9px}
.empty-rail{flex:1 1 auto;display:flex;align-items:center;gap:7px;color:var(--line)}
.empty-rail i{width:44px;height:46px;border-radius:13px;border:2px dashed var(--line);flex:0 0 auto}

/* modals */
.ask{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px;
  background:color-mix(in srgb, var(--ink) 58%, transparent);backdrop-filter:blur(3px)}
.ask-card{position:relative;width:100%;max-width:450px;padding:20px;background:var(--panel);
  border-radius:26px;box-shadow:var(--shadow-lift);display:grid;gap:14px}
.ask-head{display:flex;align-items:center;gap:10px;color:var(--chipc,var(--sky))}
.ask-head svg{width:28px;height:28px}
.ask-row{display:flex;gap:10px;align-items:center}
.ask input{flex:1 1 auto;min-width:0;height:52px;border-radius:16px;border:2px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:0 14px;font:500 17px/1.2 inherit}
.ask input:focus{outline:none;border-color:var(--sky)}
.ask-ok{flex:0 0 auto;width:52px;height:52px;border-radius:16px;background:var(--leaf);color:#fff;
  display:grid;place-items:center}
.ask-ok svg{width:22px;height:22px}
.ask .traits{position:static;box-shadow:none;background:var(--panel2);padding:12px;
  grid-template-columns:1fr 1fr;gap:10px 18px}
.ask .trow{grid-template-columns:18px 1fr;color:var(--muted)}
.ask .tbar{background:var(--line2)}
.ask-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  background:var(--panel2);color:var(--muted);display:grid;place-items:center}
.ask-x svg{width:13px;height:13px}
.micwrap{display:grid;place-items:center;padding:6px 0 2px}
.micbtn{position:relative;width:132px;height:132px;border-radius:50%;background:var(--coral);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.10), 0 16px 34px rgba(255,107,87,.34);
  transition:transform .12s ease, box-shadow .12s ease;touch-action:none;-webkit-user-select:none;user-select:none}
.micbtn:active,.micbtn[data-rec="1"]{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.10), 0 8px 18px rgba(255,107,87,.34)}
.micbtn[data-rec="1"]{background:var(--leaf);box-shadow:0 2px 0 rgba(0,0,0,.10), 0 8px 22px rgba(53,192,122,.40)}
.micbtn canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none}
.micbtn .mi{position:relative;display:grid;place-items:center}
.micbtn .mi svg{width:52px;height:52px}
.micbtn[data-off="1"]{background:var(--line);box-shadow:none;color:var(--muted)}
.saying{margin:14px auto 6px;max-width:100%;background:var(--panel2);border-radius:18px;padding:12px 16px;
  font:500 17px/1.45 inherit;color:var(--ink);text-align:center;min-height:52px;display:flex;
  align-items:center;justify-content:center;gap:2px}
.saying .caret{display:inline-block;width:2px;height:20px;background:var(--coral);animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.saying[data-done="1"] .caret{display:none}
.bars{width:100%;height:46px;display:block}
.thinking{display:flex;gap:8px;justify-content:center;padding:18px 0 6px}
.thinking i{width:11px;height:11px;border-radius:50%;background:var(--line);animation:th 1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.16s}
.thinking i:nth-child(3){animation-delay:.32s}
@keyframes th{0%,100%{transform:translateY(0);opacity:.45}40%{transform:translateY(-7px);opacity:1}}
.cands{animation:candin .34s cubic-bezier(.2,1.3,.5,1)}
@keyframes candin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.micring{display:grid;place-items:center;gap:10px}
.retry{width:52px;height:52px;border-radius:16px;background:var(--panel2);color:var(--muted);display:grid;place-items:center;margin:0 auto}
.retry svg{width:24px;height:24px}
.cands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cand{background:var(--panel2);border-radius:18px;padding:12px 6px;display:grid;place-items:center;
  border:3px solid transparent;color:var(--muted);transition:transform .12s ease,border-color .12s ease,color .12s ease}
.cand:hover{transform:translateY(-3px)}
.cand[data-best="1"]{border-color:var(--chipc,var(--sky));color:var(--chipc,var(--sky));background:var(--panel)}
.cand svg{width:76px;height:60px}
.cand .sw{width:100%;height:56px;border-radius:12px}
.ask-kb{position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;
  background:transparent;color:var(--line);display:grid;place-items:center}
.ask-kb:hover{color:var(--muted)}
.ask-kb svg{width:17px;height:17px}
.askprev{display:grid;place-items:center;background:var(--panel2);border-radius:18px;padding:14px;color:var(--chipc,var(--sky))}
.askprev svg{width:120px;height:92px}
.chip .pen{position:absolute;bottom:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--coral);color:#fff;display:none;place-items:center;box-shadow:var(--shadow)}
.chip[data-custom="1"] .pen{display:grid}
.chip .pen svg{width:11px;height:11px}
.swatchrow{display:flex;gap:10px;align-items:center;justify-content:center}
.swatchrow span{width:42px;height:42px;border-radius:12px;border:2px solid var(--line2)}

.scan{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;
  background:color-mix(in srgb, var(--ink) 58%, transparent);backdrop-filter:blur(3px)}
.scan-card{position:relative;width:100%;max-width:min(680px,100%);padding:18px;
  background:var(--panel);border-radius:28px;box-shadow:var(--shadow-lift)}
.scan-x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;
  background:var(--panel2);color:var(--muted);display:grid;place-items:center;z-index:4}
.scan-x svg{width:15px;height:15px}
.scan-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.scan-src{position:relative;border-radius:18px;overflow:hidden;background:var(--panel2);aspect-ratio:1;display:grid;place-items:center}
.scan-src canvas{max-width:100%;max-height:100%;display:block}
.scan-src .boxes{position:absolute;inset:0;width:100%;height:100%}
.scan-src .boxes rect{opacity:0;animation:boxin .4s ease forwards}
@keyframes boxin{to{opacity:1}}
.scanline{position:absolute;left:0;right:0;top:-28%;height:28%;pointer-events:none;
  background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--sky) 50%,transparent),transparent);
  animation:sweep 1.5s ease-in-out 2 forwards}
@keyframes sweep{from{top:-28%}to{top:100%}}
.scan-arrow{color:var(--muted);display:grid;place-items:center}
.scan-arrow svg{width:30px;height:30px}
.scan-out{border-radius:18px;background:var(--panel2);aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.scan-out svg{width:100%;height:100%}
.scan-out.in{animation:pop2 .5s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop2{from{opacity:0;scale:.72}to{opacity:1;scale:1}}

.scan-src.wave{background:var(--panel2);display:grid;place-items:center}
.scan-src.wave canvas{width:100%;height:100%}
.playbtn{position:absolute;left:50%;bottom:12px;translate:-50% 0;width:52px;height:52px;border-radius:50%;
  background:var(--panel);color:var(--sky);display:grid;place-items:center;box-shadow:var(--shadow-lift)}
.playbtn svg{width:24px;height:24px}
.sndtraits{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;
  background:var(--panel2);border-radius:16px;padding:12px}
.sndtraits .trow{display:grid;grid-template-columns:18px 1fr;align-items:center;gap:8px;color:var(--muted)}
.sndtraits .trow svg{width:16px;height:16px}
.sndtraits .tbar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.sndtraits .tbar i{display:block;height:100%;border-radius:3px;background:var(--chipc,var(--sky));transition:width .35s ease}
.refcard{position:absolute;right:12px;bottom:12px;width:74px;height:74px;z-index:3;padding:3px;
  border-radius:16px;background:var(--panel);box-shadow:var(--shadow);border:2px solid var(--line2)}
.refcard img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.refcard[aria-pressed="true"]{border-color:var(--sky)}
.refcard .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:var(--panel);display:grid;place-items:center}
.refcard .x svg{width:9px;height:9px}
.refcard.snd{right:96px}
.refcard.snd .wv{width:100%;height:100%;display:grid;place-items:center;color:var(--sky)}
.refcard.snd .wv svg{width:34px;height:34px}
.ghost{position:absolute;inset:12px 12px 30px;display:grid;place-items:end center;pointer-events:none;z-index:1}
.ghost img{max-width:70%;max-height:90%;opacity:.15;filter:grayscale(1) contrast(1.4)}

.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.fx i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100% + 340px)) rotate(720deg);opacity:.15}}

@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr);
    grid-template-rows:minmax(150px,1.05fr) auto auto minmax(150px,.95fr) auto auto;
    grid-template-areas:"center" "railbar" "side" "dock";padding:10px;gap:9px}
  .rail{grid-area:railbar;flex-direction:row;gap:8px}
  .mark{display:none}
  .rail-scroll{flex-direction:row;overflow-x:auto;overflow-y:hidden;width:100%}
  .cat{width:60px;height:54px}
  .view{min-height:160px}
  .chip{width:74px;height:64px}.chip svg{width:46px;height:36px}
  .swatch{width:64px;height:64px}
  .stab{height:44px}
}
@media (max-width:560px){
  .app{padding:8px;gap:8px}
  .tool{width:42px;height:42px}
  .scan-pair{grid-template-columns:1fr;gap:8px}
  .scan-arrow{rotate:90deg}
}

/* ---- v0.2: tags / catchphrase / battery ---- */
.chip.txt,.chip.tag{width:auto;min-width:82px;padding:0 14px}
.chip .lb{font-weight:800;font-size:18px;line-height:1;white-space:nowrap;letter-spacing:.02em}
.chip.tag{grid-template-rows:auto auto;align-content:center;gap:3px}
.chip.tag>svg{width:44px;height:30px}
.chip.tag .lb{font-size:13px}
.pills{position:absolute;left:12px;top:12px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;max-width:34%;cursor:pointer}
.pill{height:22px;padding:0 11px;border-radius:13px;background:var(--panel);box-shadow:var(--shadow);
  font-weight:800;font-size:13px;line-height:22px;color:var(--chipc,var(--sky));border:2px solid var(--chipc,var(--sky));
  box-sizing:content-box}
.say2d{position:absolute;left:50%;top:14px;translate:-50% 0;z-index:3;max-width:44%;background:var(--panel);
  color:var(--ink);border-radius:20px;padding:9px 16px;box-shadow:var(--shadow-lift);cursor:pointer;
  border:2px solid var(--chipc,var(--sky));font-weight:800;font-size:19px;line-height:1.15;text-align:center;
  overflow-wrap:anywhere}
.say2d::after{content:"";position:absolute;left:50%;bottom:-9px;translate:-50% 0;width:14px;height:14px;
  background:var(--panel);border-right:2px solid var(--chipc,var(--sky));border-bottom:2px solid var(--chipc,var(--sky));rotate:45deg}
.battbox{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.86);color:#41505F;
  border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);font-weight:800;font-size:13px;line-height:1}
.battbox svg{width:34px;height:20px}
.battbox.b2d{position:absolute;right:12px;top:12px;z-index:3;cursor:pointer}
.battbox.b3d{position:absolute;right:10px;top:10px;z-index:4;pointer-events:none}
.say3d{position:absolute;left:50%;top:14px;translate:-50% 0;z-index:5;max-width:80%;background:var(--panel);
  color:var(--ink);border-radius:22px;padding:9px 16px;box-shadow:var(--shadow-lift);border:2px solid var(--chipc,var(--sky));
  font-weight:800;font-size:19px;line-height:1.15;text-align:center;overflow-wrap:anywhere;pointer-events:none;
  animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
.say3d::after{content:"";position:absolute;left:50%;bottom:-9px;translate:-50% 0;width:14px;height:14px;
  background:var(--panel);border-right:2px solid var(--chipc,var(--sky));border-bottom:2px solid var(--chipc,var(--sky));rotate:45deg}
/* the stage is a thin strip on phones; the sim view below already shows battery and phrase */
@media (max-width:560px){.pills,.say2d,.battbox.b2d{display:none}}

/* ---- v0.4 theme, layer 1 (from v0.3): the factory page is one calm block inside the Spark frame ----
   Panels are flat fills of one warm sand family (no outlines, no hard shadows), so the
   frame's header above and the ink-outlined entry bar below are what stands out.
   Speak / draw / send live in the frame, so the two upload buttons go away when embedded. */
:root{
  --bg:#F5E6C6; --bg2:#F9EED7; --panel:#FFFCF5; --panel2:#F8ECD2;
  --ink:#18222D; --muted:#97835F; --line:#E6D2A6; --line2:#EEDDBA;
  --stage-a:#FFFDF8; --stage-b:#FBF0D9; --grid:#E3CFA3;
  --shadow:none; --shadow-lift:0 6px 16px rgba(120,90,30,.18);
}
body{background:var(--bg)}
html.embedded body{background:transparent}
.stage,.view{border:0}
.cat[aria-pressed="true"]{background:var(--ink);color:#FFC531}
.stab[aria-pressed="true"]{color:#FFC531}
.tool.accent2{background:var(--panel2);color:var(--muted)}
.chip{border:2px solid transparent}
.chip[aria-pressed="true"]{border-color:var(--chipc,var(--sky))}
.mcard{border-width:2px}
.traits,.battbox,.spin-hint{box-shadow:0 2px 8px rgba(60,45,15,.16)}
.stage{background:radial-gradient(120% 90% at 50% 8%,var(--stage-a),var(--stage-b))}
html.embedded #bAudio,html.embedded #bPhoto{display:none}
/* short viewports (the page sits inside the builder frame): two columns so every category stays on screen */
@media (min-width:1001px) and (max-height:780px){
  .app{grid-template-columns:132px minmax(0,1fr) minmax(300px,390px)}
  .mark{height:44px}
  .rail-scroll{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
  .cat{height:52px;border-radius:16px}
}

/* ---- v0.4 theme, layer 2: flat surfaces ---- */
:root{
  --bg:#FFFFFF; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#FFFFFF;
  --muted:#8C939C; --line:#E3E6EA; --line2:#ECEEF1;
  --stage-a:#FFFFFF; --stage-b:#FFFFFF; --grid:#D7DCE2;
  --pick:#FBEBC4; --pick-edge:#EBCB7C;
}
.mark,.cat,.tray,.scenes,.dock,.mcard,.stage,.view{border:1.5px solid var(--line2)}
.stage{background:#FFFFFF}
.cat[aria-pressed="true"],.stab[aria-pressed="true"]{background:var(--pick);color:var(--ink)}
.chip,.tool,.gslot{border:1.5px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--pick);border-color:var(--pick-edge)}
.tool.accent{background:#FFFFFF;color:#E0A800}
.stab:hover,.cat:hover{background:#FAFAFA}
.traits,.battbox,.spin-hint{box-shadow:0 1px 4px rgba(20,30,40,.12)}

/* ---- v0.4 theme, layer 3: tech / see-through (frosted glass, thin line icons) ----
   a faint blueprint grid with soft colour glows behind frosted-glass panels;
   thin slate line icons; the selected item is a blue gradient with a soft glow. */
:root{
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(255,255,255,.9); --hair:rgba(110,140,180,.22);
  --icon:#4B5B73; --muted:#7C8BA1; --grid:#C3D2E4; --tint:#2563EB; --tint2:#38BDF8;
  --stage-a:rgba(255,255,255,.7); --stage-b:rgba(230,242,255,.45);
}
body,html.embedded body{background:
  radial-gradient(38% 48% at 12% 18%,rgba(120,200,255,.38),transparent 70%),
  radial-gradient(34% 44% at 88% 22%,rgba(168,148,255,.30),transparent 70%),
  radial-gradient(44% 50% at 62% 98%,rgba(100,228,208,.28),transparent 70%),
  linear-gradient(rgba(80,120,180,.07) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(80,120,180,.07) 1px,transparent 1px) 0 0/28px 28px,
  #F6F9FD}
.mark,.cat,.tray,.scenes,.dock,.mcard,.stage{background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 28px rgba(40,80,140,.10)}
.view{border:1px solid var(--glass-edge);box-shadow:0 10px 30px rgba(40,80,140,.16)}
.stage{background:linear-gradient(180deg,var(--stage-a),var(--stage-b))}
.cat,.stab,.chip,.tool,.mcard{color:var(--icon)}
.cat svg *,.stab svg *,.tool svg *,.mcard svg *{stroke-width:1.8px}
.chip,.tool,.gslot{background:rgba(255,255,255,.6);border:1px solid var(--hair)}
.cat[aria-pressed="true"],.stab[aria-pressed="true"]{background:linear-gradient(135deg,var(--tint2),var(--tint));color:#fff;
  border-color:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(37,99,235,.35)}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.9);border-color:var(--tint2);
  box-shadow:0 0 0 3px rgba(56,189,248,.18),0 6px 16px rgba(37,99,235,.14)}
.chip .tick{background:linear-gradient(135deg,var(--tint2),var(--tint))}
.tool.accent{background:linear-gradient(135deg,var(--tint2),var(--tint));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.stab:hover,.cat:hover{background:rgba(255,255,255,.8)}
.traits,.battbox,.spin-hint{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(20,40,80,.14)}
.pill{background:rgba(255,255,255,.7);border-width:1px;box-shadow:none}
.mark{color:var(--tint)}
.empty-rail i{border-color:var(--hair)}

/* creature switch on the stage (Flying Cat / Duck / Crab) */
.spsw{position:absolute;left:12px;top:12px;z-index:4;display:flex;gap:4px;padding:4px;border-radius:16px;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(80,55,20,.12)}
.spsw button{display:flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 9px;border-radius:12px;
  color:#4F535A;font-weight:800;font-size:13px;white-space:nowrap;transition:background .14s ease,color .14s ease}
.spsw button svg{width:20px;height:20px}
.spsw button:hover{background:rgba(255,255,255,.9)}
.spsw button[aria-pressed="true"]{background:linear-gradient(135deg,#2C3542,#18222D);color:#FFC531;box-shadow:0 4px 12px rgba(24,34,45,.25)}
.pills{top:62px}
@media (max-width:560px){.spsw{left:8px;top:8px}.spsw button span{display:none}.spsw button{padding:0 9px}}
/* scene full size */
.viewbtn{position:absolute;right:10px;bottom:10px;z-index:6;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#2C3542;
  border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(20,40,80,.16);cursor:pointer;transition:transform .12s ease}
.viewbtn svg{width:20px;height:20px}
.viewbtn:hover{transform:scale(1.08)}
body.scene-max .view{position:fixed;inset:12px;z-index:40;min-height:0;border-radius:26px;box-shadow:0 20px 60px rgba(20,30,40,.35)}
body.scene-max .viewbtn{top:14px;right:14px;bottom:auto;width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#2C3542,#18222D);color:#FFC531;border-color:rgba(255,255,255,.3)}
body.scene-max .missions{position:fixed;left:50%;bottom:28px;translate:-50% 0;z-index:41;width:min(560px,calc(100% - 48px))}
body.scene-max .battbox.b3d{right:74px;top:18px}
@media (prefers-reduced-motion: reduce){.viewbtn{transition:none}}
/* crab colour swatches: one solid colour */
.swatch.tint{width:60px;height:60px;border-radius:16px}
.swatch.tint i{position:absolute;inset:5px;border-radius:11px}
/* colourway chips show the picture itself */
.chip.figv{width:72px;height:80px;padding:6px}
.chip.figv img{max-width:100%;max-height:100%;object-fit:contain;display:block}
/* ---- v0.4 theme, layer 4: warm-neutral colours so the glass sits with the cream frame ----
   warm off-white base, faint warm grid, peach / honey / apricot glows;
   graphite line icons; selected = graphite with a yellow icon (same as the frame's mode switch). */
:root{
  --icon:#4F535A; --muted:#8A8478; --grid:#DCCDB3; --hair:rgba(140,110,70,.20);
  --stage-a:rgba(255,255,255,.72); --stage-b:rgba(255,246,232,.45);
  --sel-a:#2C3542; --sel-b:#18222D; --amber:#F5B638;
}
body,html.embedded body{background:
  radial-gradient(38% 48% at 12% 18%,rgba(255,196,150,.34),transparent 70%),
  radial-gradient(34% 44% at 88% 22%,rgba(255,220,130,.30),transparent 70%),
  radial-gradient(44% 50% at 62% 98%,rgba(255,176,150,.22),transparent 70%),
  linear-gradient(rgba(150,115,70,.07) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(150,115,70,.07) 1px,transparent 1px) 0 0/28px 28px,
  #FCF9F4}
.mark,.cat,.tray,.scenes,.dock,.mcard,.stage{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 28px rgba(120,85,40,.10)}
.view{box-shadow:0 10px 30px rgba(120,85,40,.16)}
.cat[aria-pressed="true"],.stab[aria-pressed="true"]{background:linear-gradient(135deg,var(--sel-a),var(--sel-b));color:#FFC531;
  border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 6px 18px rgba(24,34,45,.28)}
.chip[aria-pressed="true"]{background:rgba(255,255,255,.92);border-color:var(--amber);
  box-shadow:0 0 0 3px rgba(245,182,56,.22),0 6px 16px rgba(120,85,40,.14)}
.chip .tick{background:var(--sel-b)}
.tool.accent{background:linear-gradient(135deg,var(--sel-a),var(--sel-b));color:#FFC531;box-shadow:0 4px 14px rgba(24,34,45,.26)}
.mark{color:var(--amber)}
.traits,.battbox,.spin-hint{box-shadow:0 4px 14px rgba(80,55,20,.14)}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="mark" id="mark"></div>
    <div class="rail-scroll" id="rail"></div>
  </aside>

  <main class="center">
    <div class="stage" id="stage"></div>
    <div class="tray" id="tray"></div>
  </main>

  <aside class="side">
    <div class="scenes" id="scenes"></div>
    <div class="view" id="view">
      <canvas id="cv"></canvas>
      <div class="traits" id="traits"></div>
      <div class="battbox b3d" id="batt3d"></div>
      <div class="say3d" id="say3d" hidden></div>
      <div class="spin-hint" id="spinHint"></div>
      <button class="viewbtn" id="viewMax" type="button" aria-label="open the scene full size"></button>
      <div class="fx" id="fx"></div>
    </div>
    <div class="missions" id="missions"></div>
  </aside>

  <div class="dock">
    <button class="tool accent2" id="bAudio" aria-label="upload recording"></button>
    <button class="tool accent2" id="bPhoto" aria-label="upload drawing"></button>
    <button class="tool" id="bUndo" aria-label="undo"></button>
    <button class="tool" id="bDice" aria-label="random"></button>
    <button class="tool accent" id="bSave" aria-label="save"></button>
    <button class="tool" id="bSound" aria-label="sound"></button>
    <div class="sep"></div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="afile" accept="audio/*" hidden>

<div class="scan" id="snd" hidden>
  <div class="scan-card">
    <button class="scan-x" id="sndX" aria-label="close"></button>
    <div class="scan-pair">
      <div class="scan-src wave">
        <canvas id="waveCv"></canvas>
        <button class="playbtn" id="playBtn" aria-label="play"></button>
      </div>
      <div class="scan-arrow" id="sndArrow"></div>
      <div class="scan-out" id="sndOut"></div>
    </div>
    <div class="sndtraits" id="sndTraits"></div>
  </div>
</div>

<div class="ask" id="ask" hidden>
  <div class="ask-card">
    <button class="ask-x" id="askX" aria-label="close"></button>
    <button class="ask-kb" id="askKb" aria-label="keyboard"></button>
    <div class="ask-head" id="askHead"></div>
    <div class="micwrap" id="micWrap">
      <button class="micbtn" id="micBtn" aria-label="hold to talk">
        <canvas id="micCv"></canvas><span class="mi" id="micIcon"></span>
      </button>
    </div>
    <div id="askBody"></div>
    <div class="ask-row" id="askTextRow" hidden>
      <input id="askInput" type="text" maxlength="40" autocomplete="off" aria-label="input">
      <button class="ask-ok" id="askOk" aria-label="confirm"></button>
    </div>
  </div>
</div>

<div class="scan" id="scan" hidden>
  <div class="scan-card">
    <button class="scan-x" id="scanX" aria-label="close"></button>
    <div class="scan-pair">
      <div class="scan-src">
        <canvas id="scanCv"></canvas>
        <svg class="boxes" id="scanBoxes" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none"></svg>
        <span class="scanline" id="scanLine"></span>
      </div>
      <div class="scan-arrow" id="scanArrow"></div>
      <div class="scan-out" id="scanOut"></div>
    </div>
  </div>
</div>

/* ---- v0.2: personality tags, catchphrase, battery ----
   Tag labels follow the v0.1 mood names (lively / calm / shy / brave) plus the v0.1 "curious" bar.
   A tag is a preset of the four trait bars; several tags average. The preset phrases and the
   20/60/100 % battery steps are placeholders, not taken from any TGR or team source. */
const TAGS = ["lively", "calm", "shy", "brave", "curious"];
const TAG_LABEL = { lively: "Lively", calm: "Calm", shy: "Shy", brave: "Brave", curious: "Curious" };
const TAG_VEC = { ...MOODS, curious: { speed: .50, bounce: .50, bold: .50, curious: .95 } };
const TAG_MAX = 3;
const PHRASES = ["Let's go!", "Here I come!", "Go go go!", "Hehe!"];
const PHRASE_MAX = 20;
const BATTERY = ["low", "mid", "full"];
const BATT_PCT = { low: 20, mid: 60, full: 100 };
const BATT_N = { low: 1, mid: 2, full: 3 };
const BATT_COL = { low: "#FF6B57", mid: "#FFC531", full: "#35C07A" };
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const sig = t => ["speed", "bounce", "bold", "curious"].map(k => Math.round(t[k] * 100)).join(",");

/* which tags describe a set of trait bars: the closest one always, up to two more that are close too */
function tagsFromTraits(t) {
  const d = id => {
    const v = TAG_VEC[id];
    return Math.sqrt(["speed", "bounce", "bold", "curious"].reduce((s, k) => s + (t[k] - v[k]) ** 2, 0)) / 2;
  };
  const ranked = TAGS.map(id => [id, d(id)]).sort((a, b) => a[1] - b[1]);
  return ranked.filter(([, dist], i) => i === 0 || dist < .22).slice(0, TAG_MAX).map(r => r[0]);
}
function applyTags(tags) {
  const c = state.cfg, t = { speed: 0, bounce: 0, bold: 0, curious: 0 };
  tags.forEach(id => { for (const k in t) t[k] += TAG_VEC[id][k] / tags.length; });
  c.tags = tags; c.traits = t; c.tagsFor = sig(t);
  c.mood = tags.length === 1 && MOODS[tags[0]] ? tags[0] : "custom";
  c.moodText = "";
}
function toggleTag(id) {
  const cur = [...(state.cfg.tags || [])], i = cur.indexOf(id);
  if (i >= 0) { if (cur.length === 1) { sFail(); return; } cur.splice(i, 1); }
  else { cur.push(id); if (cur.length > TAG_MAX) cur.shift(); }
  pushHistory(); applyTags(cur); refresh(); sPick();
}
function setPhrase(p) {
  p = String(p || "").trim().slice(0, PHRASE_MAX);
  if (state.cfg.phrase === p) return;
  pushHistory(); state.cfg.phrase = p; refresh();
  if (p) { sPick(); sayPhrase(); } else sTap();
}

function battSVG(l) {
  const n = BATT_N[l] || 3, col = BATT_COL[l] || BATT_COL.full;
  const bars = [0, 1, 2].map(i =>
    `<rect x="${5 + i * 9.5}" y="6" width="8" height="12" rx="1.6" fill="${i < n ? col : "currentColor"}" opacity="${i < n ? 1 : .22}"/>`).join("");
  return `<svg viewBox="0 0 40 24" aria-hidden="true"><rect x="1.5" y="2.5" width="33" height="19" rx="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="36" y="8.5" width="3" height="7" rx="1.4" fill="currentColor"/>${bars}</svg>`;
}
const battHTML = l => `${battSVG(l)}<span>${BATT_PCT[l] || 100}%</span>`;

/* HUD drawn over the 2D stage; each piece opens its own tray when tapped */
const SPECIES_TABS = [["cat", "logo", "Flying Cat"], ["duck", "logoDuck", "Duck"], ["crab", "logoCrab", "Crab"]];
function stageHud() {
  const c = state.cfg, sp = spOf(c), fig = figOn();
  return `<div class="spsw" role="group" aria-label="creature">${SPECIES_TABS.map(([id, ic, lb]) =>
      `<button type="button" data-sp="${id}" aria-pressed="${sp === id && !fig}">${UI[ic]}<span>${lb}</span></button>`).join("")}</div>` +
    `<div class="pills" data-pick="tags" aria-label="tags">${(c.tags || []).map(id => `<span class="pill">${TAG_LABEL[id]}</span>`).join("")}</div>` +
    (c.phrase ? `<div class="say2d" data-pick="phrase">${esc(c.phrase)}</div>` : "") +
    `<div class="battbox b2d" data-pick="battery" aria-label="battery">${battHTML(c.battery)}</div>`;
}
function renderHud() { $("#batt3d").innerHTML = battHTML(state.cfg.battery); }

let sayTimer = 0;
function sayPhrase() {
  const p = state.cfg.phrase, el = $("#say3d");
  clearTimeout(sayTimer);
  if (!p) { el.hidden = true; return; }
  el.hidden = true; void el.offsetWidth;
  el.textContent = p; el.hidden = false;
  sayTimer = setTimeout(() => { el.hidden = true; }, 2300);
}

  ["#35C07A", ["绿", "green"]], ["#22B8C4", ["青", "湖蓝", "teal", "cyan"]], ["#3D86E8", ["蓝", "blue"]],

  ["#5A6370", ["黑", "灰", "black", "grey", "gray"]], ["#A9763F", ["棕", "咖啡", "brown"]]
];
function colorsFromText(txt) {
  const t = String(txt || "").toLowerCase();
  const hex = t.match(/#[0-9a-f]{6}/g) || [];
  const found = [];
  for (const [c, words] of COLOR_LEX) {
    const at = words.map(w => t.indexOf(w)).filter(i => i >= 0);
    if (at.length) found.push([Math.min(...at), c]);
  }
  found.sort((a, b) => a[0] - b[0]);
  const list = [...hex, ...found.map(f => f[1])];
  if (!list.length) {
    let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    return [`hsl(${hue} 68% 58%)`, `hsl(${(hue + 150) % 360} 62% 56%)`];
  }
  const body = list[0];
  if (list[1]) return [body, list[1]];
  const [r, g, b] = hex2rgb(body), [hh, ss, ll] = rgb2hsl(r, g, b);
  return [body, `hsl(${Math.round((hh + 150) % 360)} ${Math.round(clamp(ss, .45, .8) * 100)}% ${Math.round(clamp(ll, .45, .62) * 100)}%)`];
}

let actx = null;
function beep(freq, dur = .08, type = "sine", vol = .05, delay = 0) {
  if (!state.sound) return;
  freq *= .78 + TR().speed * .5;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}

const GROUND = 272, CX = 120;
const INK = "#1B1B22", WHITE = "#FFFFFF", CYAN = "#3FD2E8", PINK = "#F7A8BC", TEAR = "#5FC8E8", MOUTH = "#8E1C22";

function sh(hex, k) {
  if (!/^#/.test(hex)) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * k), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * k), 0, 255);
  const b = clamp(Math.round((n & 255) * k), 0, 255);
  return `rgb(${r},${g},${b})`;
}

  if (id === "none") return "";

  if (id === "bat") {
    return `<path d="M${CX - 34} ${cy - 20} C${CX - 86} ${cy - 40} ${CX - 104} ${cy + 4} ${CX - 92} ${cy + 26}
              C${CX - 74} ${cy + 8} ${CX - 60} ${cy + 26} ${CX - 44} ${cy + 18}z" fill="${WC}" stroke="${INK}" stroke-width="3"/>
            <path d="M${CX + 34} ${cy - 20} C${CX + 86} ${cy - 40} ${CX + 104} ${cy + 4} ${CX + 92} ${cy + 26}
              C${CX + 74} ${cy + 8} ${CX + 60} ${cy + 26} ${CX + 44} ${cy + 18}z" fill="${WC}" stroke="${INK}" stroke-width="3"/>`;
  }
  const n = id === "b5" ? 5 : 3;
  let out = "";
  for (let s = -1; s <= 1; s += 2) for (let i = 0; i < n; i++) {
    const a = (-52 + i * (104 / (n - 1))) * Math.PI / 180;     /* fan from up-back to down-back */
    const len = 78 - Math.abs(i - (n - 1) / 2) * 6;
    const bx = CX + s * 26, by = cy - 12;
    const ex = bx + s * Math.cos(a) * len * .82, ey = by + Math.sin(a) * len;
    const nx = -Math.sin(a) * 11, ny = Math.cos(a) * 11;
    out += `<path d="M${bx} ${by} L${(ex + nx).toFixed(1)} ${(ey + ny).toFixed(1)}
              L${ex.toFixed(1)} ${ey.toFixed(1)} L${(ex - nx).toFixed(1)} ${(ey - ny).toFixed(1)}z"
              fill="${i % 2 ? dark : WC}" stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"/>`;
  }

}

       <path d="M${hx + hr * .95 - 5} ${hy - hr * 1.2} l20-3"/></g>`;
  if (id === "shock") return open(eyeL, 8.5, 10.5) + open(eyeR, 8.5, 10.5) +
    `<path d="M${hx - 11} ${my - 6} h22 l9 ${hr * 1.5} h-40z" fill="${MOUTH}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  if (id === "love") return `
     <path d="M${eyeL - 8} ${ey + 3} L${eyeL} ${ey - 5} L${eyeL + 8} ${ey + 3}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
     <path d="M${eyeR - 8} ${ey + 3} L${eyeR} ${ey - 5} L${eyeR + 8} ${ey + 3}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
     <path d="M${hx - 13} ${my} a7 7 0 0 1 13 4 7 7 0 0 1 13-4c0 7-7 11-13 15-6-4-13-8-13-15z" fill="${MOUTH}" stroke="${INK}" stroke-width="2.4"/>`;
  if (id === "meh") return open(eyeL, 7.5, 8.5) + dot(eyeL, 3.4) +
    `<circle cx="${eyeR}" cy="${ey}" r="4" fill="${INK}"/>
     <path d="M${hx - 9} ${my + 2} h20" stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none"/>
     <path d="M${hx + hr * .82} ${hy - hr * .55} c5 8 7 11 7 13.4a7 7 0 0 1-14 0c0-2.4 2-5.4 7-13.4z" fill="${TEAR}" stroke="${INK}" stroke-width="2"/>
     ${[0, 1, 2].map(i => `<circle cx="${hx + hr * 1.5 + i * 13}" cy="${hy - hr * 1.5}" r="4.4" fill="${INK}"/>`).join("")}`;
  if (id === "fang") return open(eyeL, 7, 9) + open(eyeR, 7, 9) +
    `<path d="M${hx - 20} ${my - 4} h40 l-6 10 -6-6 -7 7 -7-7 -6 6z" fill="${WHITE}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
  if (id === "huh") return dot(eyeL, 5) + dot(eyeR, 5) +
    `<path d="M${hx - 12} ${my - 2} a12 12 0 0 0 24 0" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
     ${[[-1.55, -1.5], [-.7, -1.95], [.7, -1.95], [1.55, -1.5]].map(([dx, dy], i) => {
        const qx = hx + hr * dx, qy = hy + hr * dy, s = i % 2 ? .9 : .75;
        return `<g transform="translate(${qx} ${qy}) scale(${s}) rotate(${i < 2 ? -18 : 18})" stroke="${INK}" stroke-width="3.2" fill="none" stroke-linecap="round">
          <path d="M-5 -6a5 5 0 1 1 5 5v3"/><circle cx="0" cy="6" r="1.8" fill="${INK}"/></g>`;
      }).join("")}`;
  /* happy — the first panel of the sheet */
  return arc(eyeL, 1) + arc(eyeR, 1) +
    `<path d="M${hx - 17} ${my - 6} h34 a17 16 0 0 1-34 0z" fill="${MOUTH}" stroke="${INK}" stroke-width="3"/>
     <path d="M${hx - 12} ${my - 6} l4 7 4-7" fill="${WHITE}"/><path d="M${hx + 12} ${my - 6} l-4 7-4-7" fill="${WHITE}"/>
     <ellipse cx="${hx}" cy="${my + 7}" rx="7" ry="5" fill="${PINK}"/>`;
}

function creature2D_cat(cfg, interactive, noShadow) {
  const [BC, WC] = (cfg.color === "custom" ? (cfg.customColor || COLORS[0]) : (COLORS[cfg.color] || COLORS[0]));
  const belly = sh(BC, 1.14), dark = sh(BC, .88);
  const t = cfg.traits || MOODS.lively;
  const tilt = ((t.curious - .5) * 10 - (1 - t.bold) * 5).toFixed(1);

  /* proportions per body type */
  const B = {
    round:  { rx: 44, ry: 48, cy: 186, hr: 36, legs: 1, legH: 40 },
    slim:   { rx: 32, ry: 58, cy: 176, hr: 31, legs: 1, legH: 44 },
    stocky: { rx: 54, ry: 40, cy: 196, hr: 38, legs: 1, legH: 34 },
    quad:   { rx: 58, ry: 32, cy: 200, hr: 32, legs: 2, legH: 40 }
  }[cfg.body];
  const hy = B.cy - B.ry - B.hr * .72, hx = CX;
  const g = (cat, inner) => interactive
    ? `<g class="hit" data-pick="${cat}"><g class="lift">${inner}</g></g>` : `<g>${inner}</g>`;

  /* legs */
  let legs = "";
  const footY = GROUND - 8;
  if (B.legs === 2) {
    [-40, -14, 14, 40].forEach(o =>
      legs += `<rect x="${CX + o - 7}" y="${B.cy + B.ry - 10}" width="14" height="${B.legH}" rx="7" fill="${dark}" stroke="${INK}" stroke-width="3"/>`);
  } else {
    [-20, 20].forEach(o =>
      legs += `<rect x="${CX + o - 11}" y="${B.cy + B.ry - 14}" width="22" height="${B.legH}" rx="11" fill="${dark}" stroke="${INK}" stroke-width="3"/>`);
  }
  const feet = (B.legs === 2 ? [-40, -14, 14, 40] : [-20, 20])
    .map(o => paw2D(cfg.paws, dark, CX + o, footY, B.legs === 2 ? .68 : .92)).join("");

  /* arms only for upright bodies */
  let arms = "";
  if (B.legs === 1) {
    const ay = B.cy - B.ry * .18, ax = B.rx + 9, alen = B.ry * .88;
    [-1, 1].forEach(s => {
      arms += `<rect x="${CX + s * ax - 11}" y="${ay}" width="22" height="${alen}" rx="11" fill="${dark}" stroke="${INK}" stroke-width="3"/>`;
    });
    arms += [-1, 1].map(s => paw2D(cfg.paws, dark, CX + s * ax, ay + alen, .82)).join("");
  }

  return `
    ${noShadow ? "" : `<ellipse class="shd" style="transform-origin:${CX}px ${GROUND - 1}px" cx="${CX}" cy="${GROUND - 1}" rx="${B.rx + 24}" ry="11" fill="rgba(20,32,45,.16)"/>`}
    <g class="mA"><g class="mB" style="transform-origin:${CX}px ${GROUND}px">
    ${g("wings", wings2D(cfg.wings, WC, B.cy - 6))}
    ${g("tail", tail2D(cfg.tail, BC, CX + B.rx - 6, B.cy + B.ry * .5))}
    ${g("paws", legs + arms)}
    ${g("body", `<ellipse cx="${CX}" cy="${B.cy}" rx="${B.rx}" ry="${B.ry}" fill="${BC}" stroke="${INK}" stroke-width="3.4"/>
       <ellipse cx="${CX}" cy="${B.cy + B.ry * .14}" rx="${B.rx * .58}" ry="${B.ry * .62}" fill="${belly}"/>`)}
    ${g("paws", feet)}
    <g transform="rotate(${tilt} ${hx} ${hy + B.hr})"><g class="mHead" style="transform-origin:${hx}px ${hy + B.hr}px">
      ${g("ears", ears2D(cfg.ears, BC, hx, hy, B.hr))}
      ${g("body", `<circle cx="${hx}" cy="${hy}" r="${B.hr}" fill="${BC}" stroke="${INK}" stroke-width="3.4"/>`)}
      ${g("face", face2D(cfg.face, hx, hy, B.hr))}
    </g></g>
    </g></g>`;
}

/* Idle motion on the 2D stage: each selected personality tag adds its own movement.
   lively  - hops, shadow shrinks as it leaves the ground
   calm    - slow breathing
   shy     - shrinks a little, short tremble now and then
   brave   - stands tall, chest swells
   curious - head tilts left and right
   Effects of several tags are added together (composite "add"). Not run under reduced motion. */
function idleMotion() {
  if (RM) return;
  const st = $("#stage"), A = st.querySelector(".mA"), Bm = st.querySelector(".mB"),
        H = st.querySelector(".mHead"), SH = st.querySelector(".shd");
  if (!A || !Bm || !H) return;
  const tags = state.cfg.tags || [];
  const run = (el, kf, o) => el && el.animate(kf, { iterations: Infinity, composite: "add", easing: "ease-in-out", ...o });
  if (tags.includes("lively")) {
    run(A, [{ transform: "translateY(0)" }, { transform: "translateY(-15px)", offset: .42 },
            { transform: "translateY(0)", offset: .84 }, { transform: "translateY(0)" }], { duration: 1150 });
    run(SH, [{ transform: "scaleX(1)", opacity: 1 }, { transform: "scaleX(.78)", opacity: .6, offset: .42 },
             { transform: "scaleX(1)", opacity: 1, offset: .84 }, { transform: "scaleX(1)", opacity: 1 }], { duration: 1150, composite: "replace" });
  }
  if (tags.includes("calm"))
    run(Bm, [{ transform: "scale(1,1)" }, { transform: "scale(.99,1.03)" }], { duration: 2400, direction: "alternate" });
  if (tags.includes("shy")) {
    run(Bm, [{ transform: "scale(.94)" }, { transform: "scale(.94)" }], { duration: 1000 });
    run(A, [{ transform: "translateX(0)" }, { transform: "translateX(-1.6px)", offset: .03 },
            { transform: "translateX(1.6px)", offset: .06 }, { transform: "translateX(-1.6px)", offset: .09 },
            { transform: "translateX(1.6px)", offset: .12 }, { transform: "translateX(0)", offset: .15 },
            { transform: "translateX(0)" }], { duration: 2600, easing: "linear" });
  }
  if (tags.includes("brave"))
    run(Bm, [{ transform: "scale(1.03)" }, { transform: "scale(1.08,1.06)" }], { duration: 1300, direction: "alternate" });
  if (tags.includes("curious"))
    run(H, [{ transform: "rotate(0)" }, { transform: "rotate(-9deg)", offset: .25 }, { transform: "rotate(0)", offset: .5 },
            { transform: "rotate(9deg)", offset: .75 }, { transform: "rotate(0)" }], { duration: 3800 });
}

function drawStage() {
  const ticks = [];
  for (let y = GROUND - 20; y > 40; y -= 24)
    ticks.push(`<line x1="16" y1="${y}" x2="${Math.round((GROUND - y) / 24) % 2 === 0 ? 32 : 25}" y2="${y}"
      stroke="var(--grid)" stroke-width="${Math.round((GROUND - y) / 24) % 2 === 0 ? 2.4 : 1.6}" stroke-linecap="round"/>`);
  const floor = Array.from({ length: 10 }, (_, i) =>
    `<line x1="${18 + i * 24}" y1="${GROUND}" x2="${2 + i * 24}" y2="${GROUND + 26}" stroke="var(--grid)" stroke-width="1.4" opacity=".7"/>`).join("");
  const ref = state.ref;

  $("#stage").innerHTML =
    (ref && ref.ghost && !figOn() ? `<div class="ghost"><img src="${ref.src}" alt=""></div>` : "") +
    (ref ? `<button class="refcard" id="refcard" aria-pressed="${ref.ghost}" aria-label="drawing">
              <img src="${ref.src}" alt=""><span class="x" id="refx">${UI.x}</span></button>` : "") +
    (state.audio ? `<button class="refcard snd" id="audcard" aria-label="recording">
              <span class="wv">${UI.wave}</span><span class="x" id="audx">${UI.x}</span></button>` : "") +
    `<svg class="hero" viewBox="0 0 240 300" preserveAspectRatio="xMidYMax meet">
       <line x1="16" y1="46" x2="16" y2="${GROUND}" stroke="var(--grid)" stroke-width="2.4" stroke-linecap="round"/>
       ${ticks.join("")}
       <line x1="0" y1="${GROUND}" x2="240" y2="${GROUND}" stroke="var(--grid)" stroke-width="2.6"/>
       ${floor}
       ${figOn() ? figure2D() : creature2D(state.cfg, true)}
     </svg>` + stageHud();

  if (!RM) $("#stage").querySelectorAll(".eye").forEach((e, i) => {
    e.style.transformBox = "fill-box"; e.style.transformOrigin = "center";
    e.animate([{ transform: "scaleY(1)" }, { transform: "scaleY(1)", offset: .93 },
               { transform: "scaleY(.12)", offset: .965 }, { transform: "scaleY(1)" }],
              { duration: 6200 - TR().bounce * 3600, iterations: Infinity, delay: i * 40 });
  });
  idleMotion();
  $("#stage").querySelectorAll(".spsw button").forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation(); switchSpecies(b.dataset.sp); sPick(); }));
  $("#stage").querySelectorAll("[data-pick]").forEach(el =>
    el.addEventListener("click", () => { selectCat(el.dataset.pick); sTap(); }));
  const ac2 = $("#audcard");
  if (ac2) ac2.addEventListener("click", e => {
    if (e.target.closest("#audx")) { state.audio = null; drawStage(); sTap(); return; }
    try { const a = new Audio(state.audio.src); a.play(); } catch (err) {}
    sTap();
  });
  const rc = $("#refcard");
  if (rc) rc.addEventListener("click", e => {
    if (e.target.closest("#refx")) { state.ref = null; drawStage(); sTap(); return; }
    if (state.ref.cuts) { state.ref.figure = !state.ref.figure; drawStage(); rebuildVector(); renderTray(); sTap(); return; }
    state.ref.ghost = !state.ref.ghost; drawStage(); sTap();
  });
}

const hex2rgb = h => {
  if (/^#/.test(h)) return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const m = document.createElement("canvas").getContext("2d");
  m.fillStyle = h; m.fillRect(0, 0, 1, 1);
  const d = m.getImageData(0, 0, 1, 1).data; return [d[0], d[1], d[2]];
};

/* ============================================================
   5.  SIMULATION PREVIEW
   The creature here is the studio render itself, cut out of the
   reference frame: one body sprite plus one wing blade, re-fanned
   per wing choice and hue-shifted per colour choice. The scene
   behind it is painted per tab.
   ============================================================ */
const IMG = { grass: new Image() };
IMG.grass.src = ASSET_GRASS;

/* The rendered frame is used whole and untouched — no cut-outs. When an action
   plays, the pane dissolves to the live preview, where the vector character
   from the build stage can actually move, then dissolves back to the render. */
let vecImg = null, photoA = 1;
/* the render matches one exact build — the reference one. Change any of it and
   the pane drops to the live preview instead of showing a stale render. */
const REF_BUILD = { body: "round", ears: "cat", wings: "b5", paws: "pad", tail: "long", color: 0 };
const isReference = () => !figOn() && spOf(state.cfg) === "cat" && Object.keys(REF_BUILD).every(k => state.cfg[k] === REF_BUILD[k]);
function rebuildVector() {
  if (figOn()) { const im = new Image(); im.onload = () => { vecImg = im; }; im.src = figCut(); return; }
  if (SPECIES[spOf(state.cfg)].photo) { const im = new Image(); im.onload = () => { vecImg = im; }; im.src = photoSrc(state.cfg); return; }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 24 200 252" width="400" height="504">`
            + creature2D(state.cfg, false, true) + `</svg>`;
  const im = new Image();
  im.onload = () => { vecImg = im; };
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

const cv = $("#cv"), ctx = cv.getContext("2d");
let W = 300, H = 220, DPR = 1;

/* creature placement, in scene units: x across, y above the ground */
const act = { x: 0, y: 0, s: 1, rot: 0, hold: null };
let parallax = 0, pTarget = 0, drag = false, dragX = 0;
let run = null, tSec = 0;

function resize() {
  const r = $("#view").getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(160, r.width); H = Math.max(120, r.height);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(resize).observe($("#view"));

const view = $("#view");
view.addEventListener("pointerdown", e => { drag = true; dragX = e.clientX; view.setPointerCapture(e.pointerId); });
view.addEventListener("pointermove", e => {
  if (!drag) return;
  pTarget = clamp(pTarget + (e.clientX - dragX) * .0016, -1, 1);
  dragX = e.clientX;
});
["pointerup", "pointercancel"].forEach(t => view.addEventListener(t, () => { drag = false; }));

const groundY = () => H * (SC().ground ? .82 : .60);

/* ---- stars, reseeded when a scene asks for them ---- */
let stars = [];
function reseedStars() {
  const n = SC().stars || 0;
  stars = Array.from({ length: n }, (_, i) => {
    const h = ((i + 7) * 2654435761) >>> 0;
    return { x: ((h >>> 3) % 1000) / 1000, y: ((h >>> 13) % 1000) / 1000, r: .5 + ((h >>> 23) % 10) / 9 * 1.2 };
  });
}

function paintScene() {
  const S2 = SC(), px = parallax * W * .06;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, S2.sky[0]); g.addColorStop(1, S2.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (stars.length) {
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const s of stars) { ctx.beginPath(); ctx.arc(s.x * W + px * .3, s.y * H * .8, s.r, 0, 7); ctx.fill(); }
  }

  if (S2.deco === "planets") {
    const pl = [[.20, .30, .17, "#FFC45C"], [.74, .19, .10, "#D67A56"], [.50, .58, .055, "#6E9EDC"], [.90, .52, .04, "#B094E8"]];
    pl.forEach(([fx, fy, fr, col], i) => {
      const cx = fx * W + px * (1 + i * .5), cy = fy * H, r = fr * Math.min(W, H) * 1.5;
      const rg = ctx.createRadialGradient(cx - r * .35, cy - r * .35, r * .15, cx, cy, r);
      rg.addColorStop(0, col); rg.addColorStop(1, sh(col, .45));
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
      if (i === 1) {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.35); ctx.scale(1, .26);
        ctx.strokeStyle = "rgba(226,198,150,.85)"; ctx.lineWidth = r * .30;
        ctx.beginPath(); ctx.arc(0, 0, r * 1.7, 0, 7); ctx.stroke(); ctx.restore();
      }
    });
    return;
  }

  const gy = groundY();
  if (S2.ground) {
    if (state.scene === "moon" || S2.deco === "craters") {
      ctx.fillStyle = "#6E8FC4";
      const ex = W * .78 + px, ey = H * .20, er = Math.min(W, H) * .13;
      const rg = ctx.createRadialGradient(ex - er * .4, ey - er * .4, er * .2, ex, ey, er);
      rg.addColorStop(0, "#8FB4E8"); rg.addColorStop(1, "#33538C");
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
    }
    ctx.fillStyle = S2.ground;
    ctx.beginPath();
    ctx.moveTo(-10, gy + 14);
    for (let i = 0; i <= 12; i++) {
      const x = i / 12 * (W + 20) - 10;
      ctx.lineTo(x, gy - Math.sin(i * .9 + parallax) * 7 - Math.cos(i * .45) * 5);
    }
    ctx.lineTo(W + 10, H); ctx.lineTo(-10, H); ctx.closePath(); ctx.fill();

    if (S2.hills) {
      ctx.fillStyle = S2.hills; ctx.globalAlpha = .8;
      ctx.beginPath(); ctx.moveTo(-10, gy + 2);
      for (let i = 0; i <= 10; i++) {
        const x = i / 10 * (W + 20) - 10 + px * .4;
        ctx.lineTo(x, gy - 18 - Math.sin(i * 1.2) * 13 - Math.cos(i * .6) * 9);
      }
      ctx.lineTo(W + 10, gy + 2); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    }
    if (S2.deco === "craters") {
      ctx.fillStyle = S2.ground2; ctx.globalAlpha = .7;
      [[.18, .90, .11], [.46, .96, .08], [.78, .88, .10], [.62, 1.06, .13], [.08, 1.02, .07]].forEach(([fx, fy, fr]) => {
        ctx.beginPath(); ctx.ellipse(fx * W + px, gy + (fy - .88) * H * .4 + 18, fr * W, fr * W * .28, 0, 0, 7); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }
    if (S2.deco === "grass") {
      ctx.strokeStyle = S2.ground2; ctx.lineWidth = 2.4; ctx.lineCap = "round";
      for (let i = 0; i < 40; i++) {
        const fx = ((i * 97) % 100) / 100, fy = ((i * 53) % 100) / 100;
        const x = fx * W + px * (.4 + fy), y = gy + 6 + fy * (H - gy);
        const hh = 7 + fy * 16;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(i) * 4, y - hh); ctx.stroke();
      }
    }
  }
  if (["ember", "dust", "bubble", "snow"].includes(S2.deco)) {
    const col = { ember: "#FF8C3C", dust: "#D6BA8C", bubble: "#B4E2F0", snow: "#F6FAFF" }[S2.deco];
    ctx.fillStyle = col; ctx.globalAlpha = .75;
    for (let i = 0; i < 18; i++) {
      const fx = ((i * 61) % 100) / 100, sp = .3 + (i % 5) * .2;
      const y = ((tSec * sp * 40 + i * 57) % (H + 40)) - 20;
      ctx.beginPath(); ctx.arc(fx * W + Math.sin(tSec + i) * 10 + px, S2.deco === "ember" ? H - y : y, 2.6 + (i % 3), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function paintProps(back) {
  if (!run) return;
  const gy = groundY(), px = parallax * W * .06;
  const P = (fx, fy) => [fx * W + px, gy - fy * H];
  if (run.id === "grab") {
    if (back) return;
    const b = run.carried ? [W / 2 + act.x * W * .30 + px, gy - act.y * H - H * .30] : P(run.ballAt[0], run.ballAt[1]);
    const rg = ctx.createRadialGradient(b[0] - 5, b[1] - 6, 2, b[0], b[1], 15);
    rg.addColorStop(0, "#FFE08A"); rg.addColorStop(1, "#E0A319");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(b[0], b[1], 14, 0, 7); ctx.fill();
    const p = P(.20, 0);
    ctx.fillStyle = "rgba(60,180,120,.75)";
    ctx.beginPath(); ctx.ellipse(p[0], p[1] + 4, 34, 11, 0, 0, 7); ctx.fill();
  } else if (run.id === "fly") {
    if (!back) return;
    [[.24, .52], [.52, .70], [.80, .48]].forEach(([fx, fy], i) => {
      if (run.rings[i]) return;
      const [x, y] = P(fx, fy);
      ctx.strokeStyle = "#FFC531"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.ellipse(x, y, 30, 34, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = "rgba(255,240,200,.9)"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(x, y, 30, 34, 0, 0, 7); ctx.stroke();
    });
  } else if (run.id === "climb") {
    if (back) return;
    const [x, y] = P(.62, 0);
    const rg = ctx.createLinearGradient(x, y - 70, x, y);
    rg.addColorStop(0, "#C9CFD6"); rg.addColorStop(1, "#8D96A1");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.ellipse(x, y - 24, 62, 44, 0, 0, 7); ctx.fill();
  } else if (run.id === "dance") {
    if (!back) return;
    [[.22, .62, "#FF6B57"], [.40, .80, "#35C07A"], [.62, .78, "#FFC531"], [.80, .60, "#9B6BE8"]].forEach(([fx, fy, c], i) => {
      const [x, y] = P(fx, fy);
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y + Math.sin(tSec * 3 + i) * 12, 9, 0, 7); ctx.fill();
    });
  }
}

function paintCreature() {
  if (!vecImg || photoA > .999) return;
  const gy = groundY(), px = parallax * W * .06;
  /* the preview shows the creature small inside its scene; the stage already shows it large */
  let bh = H * .30 * act.s;
  let bw = bh * vecImg.width / vecImg.height;
  if (bw > W * .42 * act.s) { bw = W * .42 * act.s; bh = bw * vecImg.height / vecImg.width; }  /* wide pictures fit the pane */
  const cx = W / 2 + act.x * W * .30 + px;
  const cy = gy - act.y * H - bh / 2;

  ctx.save();
  ctx.globalAlpha = 1 - photoA;
  if (SC().ground) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, .15 - act.y * 1.1) * (1 - photoA);
    ctx.fillStyle = "#16202B";
    ctx.beginPath(); ctx.ellipse(cx, gy + 2, bw * .28, bh * .04, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.translate(cx, cy); ctx.rotate(act.rot);
  ctx.drawImage(vecImg, -bw / 2, -bh / 2, bw, bh);
  ctx.restore();
}

function paintRender() {
  if (!IMG.grass.width || photoA <= .001) return;
  const zoom = 1.06 + (run ? .06 : 0) + Math.sin(tSec * .18) * .015;
  const k = Math.max(W / IMG.grass.width, H / IMG.grass.height) * zoom;
  const w = IMG.grass.width * k, h = IMG.grass.height * k;
  ctx.save(); ctx.globalAlpha = photoA;
  ctx.drawImage(IMG.grass, (W - w) / 2 + parallax * W * .05, (H - h) * .60, w, h);
  ctx.restore();
}

function drawPreview() {
  ctx.clearRect(0, 0, W, H);
  paintScene();
  paintProps(true);
  paintCreature();
  paintProps(false);
  paintRender();
}

/* ============================================================
   6.  ACTIONS  (parts decide what the creature can do;
       the outcome sets its expression)
   ============================================================ */
/* each creature can do the missions with its own parts (see SPECIES.missions) */
const missionNeed = m => {
  const o = (SPECIES[spOf(state.cfg)].missions || {})[m.id];
  return o === undefined ? { cat: m.cat, ok: m.ok } : (o ? { cat: o[0], ok: o[1] } : { cat: null, ok: null });
};
const missionOk = m => { const n = missionNeed(m); return !n.cat || n.ok.includes(state.cfg[n.cat]); };

function startMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  hideBubble();
  const ok = missionOk(m), T = TR();
  run = { id, t: 0, dur: ok ? m.dur * (1.42 - T.speed * .68) : 2.3, ok, carried: false,
          ballAt: [.78, 0], rings: [false, false, false] };
  setFace(ok ? "happy" : "huh");
  renderMissions(); sTap();
  if (ok) sayPhrase();
}
function setFace(id) {
  if (state.cfg.face !== id) { state.cfg.face = id; drawStage(); renderTray(); }
}

function stepMission(dt) {
  if (!run) return;
  run.t += dt;
  const m = MISSIONS.find(x => x.id === run.id), T = TR(), S2 = SC();
  const raw = Math.min(1, run.t / run.dur);
  const p = clamp(raw + (1 - T.bold) * .045 * Math.sin(raw * Math.PI * 8), 0, 1);
  const gk = 1 / Math.max(.20, S2.g === 0 ? .25 : S2.g);
  act.s = 1; act.rot = 0;

  if (!run.ok) {
    act.x = -.5 + Math.min(1, p / .55) * .45; act.y = 0;
    if (p > .6 && !RM) act.rot = Math.sin(run.t * 22) * .05;
    if (raw >= 1) finishMission(false, m);
    return;
  }

  if (run.id === "fly") {
    act.x = -1 + p * 2;
    act.y = .30 + Math.sin(p * Math.PI * 3) * .16 + (S2.g === 0 ? .12 : 0);
    act.rot = Math.cos(p * Math.PI * 3) * .18;
    act.s = .82 + Math.sin(p * Math.PI) * .18;
    [[.24, .52], [.52, .70], [.80, .48]].forEach(([fx, fy], i) => {
      const dx = (W / 2 + act.x * W * .30) / W - fx, dy = act.y - fy;
      if (Math.abs(dx) < .07 && Math.abs(dy) < .14) run.rings[i] = true;
    });
  } else if (run.id === "grab") {
    if (p < .40) { act.x = -.9 + p / .40 * 1.7; act.y = 0; }
    else if (p < .50) { act.y = Math.sin((p - .40) / .10 * Math.PI) * .06; run.carried = true; }
    else if (p < .92) { act.x = .8 - (p - .50) / .42 * 1.5; act.y = 0; }
    else { run.carried = false; run.ballAt = [.20, .03]; }
  } else if (run.id === "climb") {
    if (p < .40) { act.x = -.9 + p / .40 * 1.3; act.y = 0; }
    else if (p < .70) { const t = (p - .40) / .30; act.x = .4 + t * .12; act.y = t * .17; act.rot = -.12 * t; }
    else { act.x = .52; act.y = .17; act.rot = 0; act.s = 1 + (p - .70) * .1; }
  } else {
    act.x = Math.sin(run.t * 2.2) * .35;
    act.y = RM ? 0 : Math.abs(Math.sin(run.t * 5)) * .10 * gk;
    act.rot = Math.sin(run.t * 4.4) * .16;
  }
  if (run.id !== "dance" && run.id !== "fly" && !RM) {
    act.y += T.bounce * .05 * gk * Math.abs(Math.sin(run.t * (5 + T.speed * 5)));
    act.rot += T.curious * .06 * Math.sin(run.t * 2.5);
  }
  if (raw >= 1) finishMission(true, m);
}

function finishMission(ok, m) {
  run = null;
  act.x = 0; act.y = 0; act.s = 1; act.rot = 0;
  if (ok) {
    state.done[m.id] = 3;
    setFace(TR().bold > .7 ? "fang" : "happy");
    sWin(); confetti(); sayPhrase();
    if (MISSIONS.every(x => state.done[x.id])) setTimeout(() => { setFace("love"); confetti(true); }, 420);
  } else {
    setFace(TR().bold < .35 ? "cry" : "shock");
    sFail(); showBubble(m);
  }
  renderMissions();
}
function showBubble(m) {
  const el = document.createElement("div");
  el.className = "bubble";
  el.style.setProperty("--chipc", CPAIR()[0]);
  const need = missionNeed(m);
  el.innerHTML = `<span class="q">${UI.q}</span><span class="need">${thumbOf(need.cat, need.ok[0])}</span>`;
  el.addEventListener("click", () => { selectCat(need.cat); hideBubble(); sTap(); });
  $("#view").appendChild(el);
  setTimeout(hideBubble, 5200);
}
function hideBubble() { const b = $("#view .bubble"); if (b) b.remove(); }

function confetti(big) {
  if (RM) return;
  const fx = $("#fx"); fx.innerHTML = "";
  const cols = ["#FFC531", "#FF6B57", "#35C07A", "#3D86E8", "#9B6BE8", "#22B8C4"];
  for (let i = 0; i < (big ? 46 : 26); i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "%";
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (1.1 + Math.random() * 1.1) + "s";
    s.style.animationDelay = (Math.random() * .4) + "s";
    fx.appendChild(s);
  }
  setTimeout(() => { fx.innerHTML = ""; }, 2600);
}

/* ============================================================
   7.  UI
   ============================================================ */
function renderRail() {
  $("#mark").innerHTML = UI[SPECIES[spOf(state.cfg)].logo] || UI.logo;
  $("#rail").innerHTML = CATS.map(c =>
    `<button class="cat" data-cat="${c}" aria-pressed="${state.cat === c}" aria-label="${c}">
       ${UI[c]}${c === "color" ? `<span class="dot" style="background:${CPAIR()[0]}"></span>` : ""}
     </button>`).join("");
  $("#rail").querySelectorAll(".cat").forEach(b =>
    b.addEventListener("click", () => { selectCat(b.dataset.cat); sTap(); }));
}
function renderTray() {
  const tray = $("#tray");
  tray.style.setProperty("--chipc", CPAIR()[0]);
  if (state.cat === "color" && figOn() && state.ref.cuts.length > 1) {
    tray.innerHTML = state.ref.cuts.map((c, i) =>
      `<button class="chip figv" data-v="${i}" aria-pressed="${(state.ref.pick || 0) === i}" aria-label="colourway ${i + 1}">
         <img src="${c}" alt=""><span class="tick">${UI.check}</span></button>`).join("");
    tray.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { pickFigure(+b.dataset.v); sPick(); }));
  } else if (SPECIES[spOf(state.cfg)].photo && (state.cat === "look" || state.cat === "color")) {
    const sp = spOf(state.cfg), c = state.cfg;
    if (state.cat === "color" && sp === "crab") {
      tray.innerHTML = CRAB_TINTS.map(t =>
        `<button class="swatch tint" data-tint="${t.id}" aria-pressed="${c.tint === t.id}" aria-label="colour ${t.id}">
           <i style="background:${tintBg(t)}"></i><span class="tick">${UI.check}</span></button>`).join("");
      tray.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => setPhoto("tint", b.dataset.tint)));
    } else {
      tray.innerHTML = PHOTO_ART[sp].looks.map((_, i) =>
        `<button class="chip figv" data-look="${i}" aria-pressed="${c.look === i}" aria-label="look ${i + 1}">
           <img src="${photoSrc(c, i)}" alt=""><span class="tick">${UI.check}</span></button>`).join("");
      tray.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => setPhoto("look", +b.dataset.look)));
    }
  } else if (state.cat === "color") {
    const cc = state.cfg.customColor || ["#AEB8C2", "#8C97A3"];
    tray.innerHTML = COLORS.map((c, i) =>
      `<button class="swatch" data-color="${i}" aria-pressed="${state.cfg.color === i}" aria-label="colour">
         <i class="b" style="background:${c[0]}"></i><i class="w" style="background:${c[1]}"></i>
         <span class="tick">${UI.check}</span></button>`).join("") +
      `<button class="chip" data-opt="custom" data-custom="${state.cfg.customColor ? 1 : 0}"
         aria-pressed="${state.cfg.color === "custom"}" aria-label="custom colour">
         ${THUMB["mood:custom"]}<span class="tick">${UI.check}</span></button>`;
    tray.querySelectorAll(".swatch").forEach(b =>
      b.addEventListener("click", () => setPart("color", +b.dataset.color)));
    tray.querySelector('.chip[data-opt="custom"]').addEventListener("click", () => openAsk("color"));
  } else if (state.cat === "tags") {
    const sel = state.cfg.tags || [];
    tray.innerHTML = TAGS.map(id =>
      `<button class="chip tag" data-tag="${id}" aria-pressed="${sel.includes(id)}" aria-label="tag ${TAG_LABEL[id]}">
         ${THUMB["tags:" + id]}<span class="lb">${TAG_LABEL[id]}</span><span class="tick">${UI.check}</span></button>`).join("");
    tray.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => toggleTag(b.dataset.tag)));
  } else if (state.cat === "phrase") {
    const cur = state.cfg.phrase || "", own = !!cur && !PHRASES.includes(cur);
    tray.innerHTML =
      `<button class="chip" data-p="" aria-pressed="${!cur}" aria-label="no phrase">${THUMB["phrase:none"]}<span class="tick">${UI.check}</span></button>` +
      PHRASES.map(p => `<button class="chip txt" data-p="${p}" aria-pressed="${cur === p}" aria-label="phrase ${p}">
         <span class="lb">${p}</span><span class="tick">${UI.check}</span></button>`).join("") +
      `<button class="chip ${own ? "txt" : ""}" data-own="1" aria-pressed="${own}" aria-label="type a phrase">
         ${own ? `<span class="lb">${esc(cur)}</span>` : UI.kb}<span class="tick">${UI.check}</span></button>`;
    tray.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      if (b.dataset.own) openAsk("phrase"); else setPhrase(b.dataset.p);
    }));
  } else if (state.cat === "battery") {
    tray.innerHTML = BATTERY.map(l =>
      `<button class="chip" data-b="${l}" aria-pressed="${state.cfg.battery === l}" aria-label="battery ${BATT_PCT[l]}%">
         ${THUMB["battery:" + l]}<span class="tick">${UI.check}</span></button>`).join("");
    tray.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => setPart("battery", b.dataset.b)));
  } else {
    const cat = state.cat;
    tray.innerHTML = OPTS[cat].map(o => {
      const isC = o === "custom";
      const on = isC ? (cat === "mood" ? state.cfg.mood === "custom" : !!(state.cfg.custom || {})[cat])
                     : state.cfg[cat] === o;
      return `<button class="chip" data-opt="${o}" aria-pressed="${on}"
         data-custom="${isC && on ? 1 : 0}" aria-label="${cat} ${o}">
         ${thumbOf(cat, o)}<span class="tick">${UI.check}</span>
         <span class="pen">${UI.mic}</span></button>`;
    }).join("");
    tray.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.opt;
      if (v === "custom" && cat !== "mood") { openAsk("part:" + cat); return; }
      if (cat === "mood" && v === "custom") { openAsk("mood"); return; }
      if (cat === "mood") {
        pushHistory();
        state.cfg.mood = v; state.cfg.moodText = ""; state.cfg.traits = { ...MOODS[v] };
        refresh(); sPick(); return;
      }
      setPart(cat, v);
    }));
  }
  tray.scrollLeft = 0;
}
function renderScenes() {
  $("#scenes").innerHTML = SCENE_TABS.map(s =>
    `<button class="stab" data-scene="${s}" aria-pressed="${state.scene === s}" aria-label="scene ${s}">${SCENE_ICON[s]}</button>`).join("");
  $("#scenes").querySelectorAll(".stab").forEach(b => b.addEventListener("click", () => {
    const s = b.dataset.scene;
    if (s === "custom") { openAsk("scene"); return; }
    state.scene = s; state.sceneText = "";
    reseedStars(); renderScenes(); sPick();
  }));
}
function renderMissions() {
  $("#missions").innerHTML = MISSIONS.map(m => {
    const st = run && run.id === m.id ? "run" : (state.done[m.id] ? "done" : "idle");
    const got = state.done[m.id] || 0;
    const stars = [0, 1, 2].map(i => i < got ? `<span class="on">${UI.starF}</span>` : UI.star).join("");
    return `<button class="mcard" data-m="${m.id}" data-state="${st}" aria-label="action ${m.id}">
      ${MISSION_ICON[m.id]}<span class="stars">${stars}</span></button>`;
  }).join("");
  $("#missions").querySelectorAll(".mcard").forEach(b =>
    b.addEventListener("click", () => startMission(b.dataset.m)));
}
function renderGallery() {
  const g = $("#gallery");
  if (!state.gallery.length) { g.innerHTML = `<div class="empty-rail"><i></i><i></i><i></i></div>`; return; }
  g.innerHTML = state.gallery.map((c, i) =>
    `<button class="gslot" data-i="${i}" aria-label="saved creature">
       <svg viewBox="26 28 188 252" preserveAspectRatio="xMidYMid meet">${creature2D(c, false)}</svg>
       <span class="x" data-del="${i}">${UI.x}</span></button>`).join("");
  g.querySelectorAll(".gslot").forEach(b => b.addEventListener("click", e => {
    const del = e.target.closest("[data-del]");
    if (del) { state.gallery.splice(+del.dataset.del, 1); saveGallery(); renderGallery(); sTap(); return; }
    pushHistory(); state.cfg = { ...state.gallery[+b.dataset.i] }; refresh(); sPick();
  }));
}

function selectCat(c) { state.cat = c; renderRail(); renderTray(); }
function pushHistory() { state.history.push(JSON.parse(JSON.stringify(state.cfg))); if (state.history.length > 40) state.history.shift(); }
function setPart(cat, val) { if (state.cfg[cat] === val) return; if (figOn() && !["battery", "color"].includes(cat)) state.ref.figure = false; pushHistory(); state.cfg[cat] = val; refresh(); sPick(); }
function refresh() {
  syncSpecies();
  if (!state.cfg.traits) state.cfg.traits = { ...(MOODS[state.cfg.mood] || MOODS.lively) };
  if (state.cfg.color !== "custom" && typeof state.cfg.color !== "number") state.cfg.color = 0;
  /* v0.2 fields: older saved creatures lack them; tags follow the trait bars unless the bars came from the tags */
  const c2 = state.cfg;
  if (!BATTERY.includes(c2.battery)) c2.battery = "full";
  if (typeof c2.phrase !== "string") c2.phrase = "";
  if (!Array.isArray(c2.tags) || c2.tagsFor !== sig(TR())) { c2.tags = tagsFromTraits(TR()); c2.tagsFor = sig(TR()); }
  drawStage(); renderRail(); renderTray(); renderTraits($("#traits"), TR()); renderHud(); rebuildVector();
  document.documentElement.style.setProperty("--chipc", CPAIR()[0]);
  notifyParent();
}

/* ---- one modal, one input: hold the button and talk ----

let askMode = "mood", askPending = null, askText = "", askTraits = null;
