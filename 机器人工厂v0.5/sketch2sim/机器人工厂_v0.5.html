/* ---------- microphone: simulated ----------
   This build fakes the voice round-trip so the page runs by double-click,
   with no server, no permission prompt and no recogniser. Each category
   has a scripted line; it is typed out the way partial ASR results arrive,
   then goes through the same lexicons the real transcript would.
   Set window.RF_LIVE_MIC = true to switch back to the real recorder
   (needs http://localhost — file:// cannot open the microphone).
   Set window.RF_DEMO_CAPTION = false to hide the spoken line; it is on
   here so teammates can see what was "said". ---------- */
const DEMO_LINES = {
  mood:  "It runs really fast, super brave, and very curious",
  scene: "I want to play on the moon",
  color: "A yellow body with purple wings",
  "part:body":  "A round, chubby body, like a ball",
  "part:ears":  "Long bunny ears",
  "part:wings": "I want five wings, sharp like blades",
  "part:paws":  "Soft paw pads",
  "part:tail":  "A big fluffy tail",
  "part:face":  "It is a bit angry right now"
};
let demoRun = false, demoTimers = [], demoRAF = 0, demoT0 = 0;

function clearDemo() {
  demoTimers.forEach(clearTimeout); demoTimers = [];
  cancelAnimationFrame(demoRAF);
  demoRun = false;
  $("#micBtn").dataset.rec = "0";
  drawMicLevel(0);
}
const later = (fn, ms) => demoTimers.push(setTimeout(fn, ms));

function drawMicLevel(level) {
  const c = $("#micCv"), r = 132, dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = r * dpr; c.height = r * dpr;
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, r, r);
  if (level <= 0) return;
  x.strokeStyle = "rgba(255,255,255,.6)"; x.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    const rr = 46 + i * 9 + level * 20;
    x.globalAlpha = Math.max(0, .5 - i * .14) * Math.min(1, level * 2.2);
    x.beginPath(); x.arc(r / 2, r / 2, Math.min(rr, r / 2 - 2), 0, 7); x.stroke();
  }
  x.globalAlpha = 1;
}

function drawBars(t, live) {
  const c = $("#barsCv");
  if (!c) return;
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = 34, bw = r.width / n, mid = r.height / 2;
  const cs = getComputedStyle(document.documentElement);
  x.fillStyle = live ? (cs.getPropertyValue("--leaf").trim() || "#35C07A")
                     : (cs.getPropertyValue("--line").trim() || "#C4D1DC");
  for (let i = 0; i < n; i++) {
    const w = Math.sin(i * .7 + t * 6.2) * Math.sin(i * .23 + t * 3.1) * Math.sin(t * 9 + i);
    const h = live ? Math.max(3, Math.abs(w) * r.height * .82) : 3;
    x.beginPath();
    x.roundRect(i * bw + bw * .22, mid - h / 2, Math.max(2, bw * .56), h, bw * .28);
    x.fill();
  }
}

function runMicDemo() {
  if (demoRun) return;
  if (window.RF_LIVE_MIC === true) { startLiveMic(); return; }
  clearDemo();
  demoRun = true;
  askText = ""; askTraits = null;
  const line = DEMO_LINES[askMode] || DEMO_LINES.mood;
  const caption = window.RF_DEMO_CAPTION !== false;

  $("#micBtn").dataset.rec = "1";
  $("#askBody").innerHTML =
    (caption ? `<div class="saying" id="saying"><span id="sayTxt"></span><i class="caret"></i></div>` : "") +
    `<canvas class="bars" id="barsCv"></canvas>`;
  beep(700, .07, "triangle", .04);

  demoT0 = performance.now();
  let listening = true;
  const tick = () => {
    const t = (performance.now() - demoT0) / 1000;
    drawMicLevel(listening ? .35 + Math.abs(Math.sin(t * 5.3)) * .55 : 0);
    drawBars(t, listening);
    demoRAF = requestAnimationFrame(tick);
  };
  tick();

  /* the line arrives the way streaming recognition delivers it */
  const per = caption ? Math.min(150, 1700 / line.length) : 0;
  if (caption) {
    for (let i = 1; i <= line.length; i++)
      later(() => { $("#sayTxt").textContent = line.slice(0, i); }, i * per);
  }
  const spoken = caption ? line.length * per : 1500;

  later(() => {
    listening = false;
    $("#micBtn").dataset.rec = "0";
    const sy = $("#saying"); if (sy) sy.dataset.done = "1";
    beep(520, .06, "triangle", .035);
  }, spoken + 260);

  later(() => {
    cancelAnimationFrame(demoRAF);
    $("#askBody").innerHTML =
      (caption ? `<div class="saying" data-done="1">${line}</div>` : "") +
      `<div class="thinking"><i></i><i></i><i></i></div>`;
  }, spoken + 480);

  later(() => {
    demoRun = false;
    askText = line;
    askTraits = traitsFromText(line);
    renderAskResult(caption ? line : "");
    sPick();
  }, spoken + 1240);
}

/* ---------- the real recorder, kept for when a recogniser is wired ---------- */
let micStream = null, micRec = null, micChunks = [];
async function startLiveMic() {
  try {
    micStream = micStream || await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) { micUnavailable(); return; }
  micChunks = [];
  const rec = new MediaRecorder(micStream);
  micRec = rec;
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) micChunks.push(ev.data); };
  rec.onstop = async () => {
    const blob = new Blob(micChunks, { type: rec.mimeType || "audio/webm" });
    $("#micBtn").dataset.rec = "0";
    let traits = null;
    try { traits = (await analyzeAudio(blob)).traits; } catch (e) {}
    askTraits = traits;
    askText = (typeof window.RF_ASR === "function") ? ((await window.RF_ASR(blob).catch(() => "")) || "") : "";
    renderAskResult(askText);
    sPick();
  };
  rec.start();
  $("#micBtn").dataset.rec = "1";
  later(() => { if (micRec && micRec.state === "recording") micRec.stop(); }, 4000);
}
function micUnavailable() {
  $("#micBtn").dataset.off = "1";
  $("#micIcon").innerHTML = UI.micOff;
  $("#askTextRow").hidden = false;
  sFail();
}

    body.innerHTML = said + `<div class="cands">` + pool.map((o, i) =>
      `<button class="cand" data-o="${o}" data-best="${best && i === 0 ? 1 : 0}" aria-label="${cat} ${o}">
         ${THUMB[cat + ":" + o]}</button>`).join("")

    body.querySelectorAll(".cand").forEach(b => b.addEventListener("click", () => {
      pushHistory();

/* ============================================================
   8.  HAND DRAWING → CREATURE
   All in-browser: the drawing is reduced to a silhouette and its
   shape features pick the parts. Set window.RF_ANALYZE =
   async (imageEl) => cfg to swap in a real model.
   ============================================================ */
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
  else if (mx === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  return [h * 60, s, l];
}
function analyzeDrawing(img) {
  const W2 = 128, H2 = clamp(Math.round(img.height / img.width * 128), 40, 200);
  const c = document.createElement("canvas"); c.width = W2; c.height = H2;
  const x = c.getContext("2d", { willReadFrequently: true });
  x.drawImage(img, 0, 0, W2, H2);
  const d = x.getImageData(0, 0, W2, H2).data;
  const at = (px, py) => { const i = (py * W2 + px) * 4; return [d[i], d[i + 1], d[i + 2]]; };

  let br = 0, bg = 0, bb = 0, bn = 0;
  for (let px = 0; px < W2; px++) for (const py of [0, 1, H2 - 2, H2 - 1]) { const p = at(px, py); br += p[0]; bg += p[1]; bb += p[2]; bn++; }
  for (let py = 0; py < H2; py++) for (const px of [0, 1, W2 - 2, W2 - 1]) { const p = at(px, py); br += p[0]; bg += p[1]; bb += p[2]; bn++; }
  br /= bn; bg /= bn; bb /= bn;

  const build = thr => {
    const m = new Uint8Array(W2 * H2); let n = 0;
    for (let py = 0; py < H2; py++) for (let px = 0; px < W2; px++) {
      const p = at(px, py);
      if (Math.hypot(p[0] - br, p[1] - bg, p[2] - bb) > thr) { m[py * W2 + px] = 1; n++; }
    }
    return { m, n };
  };
  let { m, n } = build(64);
  if (n < W2 * H2 * .02) ({ m, n } = build(36));
  if (n < W2 * H2 * .008) { m.fill(1); n = W2 * H2; }

  /* a sheet of several drawings: keep only the biggest connected figure */
  {
    const lab = new Int32Array(W2 * H2).fill(-1);
    const sizes = []; let best = -1;
    for (let i = 0; i < W2 * H2; i++) {
      if (!m[i] || lab[i] >= 0) continue;
      const id = sizes.length; let size = 0; const q = [i];
      lab[i] = id;
      while (q.length) {
        const k = q.pop(); size++;
        const kx = k % W2, ky = (k / W2) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = kx + dx, ny = ky + dy;
          if (nx < 0 || ny < 0 || nx >= W2 || ny >= H2) continue;
          const nk = ny * W2 + nx;
          if (m[nk] && lab[nk] < 0) { lab[nk] = id; q.push(nk); }
        }
      }
      sizes.push(size);
      if (best < 0 || size > sizes[best]) best = id;
    }
    if (best >= 0 && sizes.length > 1 && sizes[best] > n * .10) {
      for (let i = 0; i < W2 * H2; i++) if (m[i] && lab[i] !== best) m[i] = 0;
      n = sizes[best];
    }
  }

  let x0 = W2, x1 = 0, y0 = H2, y1 = 0;
  for (let py = 0; py < H2; py++) for (let px = 0; px < W2; px++) if (m[py * W2 + px]) {
    if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  const bw = Math.max(4, x1 - x0 + 1), bh = Math.max(4, y1 - y0 + 1);
  const Y = f => Math.round(y0 + bh * f);
  const span = (ya, yb) => {
    let lo = W2, hi = -1; const cols = [];
    for (let px = x0; px <= x1; px++) {
      let hit = 0;
      for (let py = ya; py <= yb; py++) if (m[py * W2 + px]) hit++;
      cols.push(hit);
      if (hit) { if (px < lo) lo = px; if (px > hi) hi = px; }
    }
    const runs = []; let s = -1;
    cols.forEach((v, i) => {
      if (v > 0 && s < 0) s = i;
      if ((v === 0 || i === cols.length - 1) && s >= 0) { runs.push({ a: s, b: i, w: i - s + 1 }); s = -1; }
    });
    return { lo, hi, w: hi < 0 ? 0 : hi - lo + 1, cols, runs: runs.filter(r => r.w > bw * .04) };
  };

  /* colour: the dominant saturated hue becomes the body, the runner-up the wings */
  const bins = new Array(24).fill(0); let sat = 0;
  for (let py = y0; py <= y1; py++) for (let px = x0; px <= x1; px++) {
    if (!m[py * W2 + px]) continue;
    const p = at(px, py), [h, s, l] = rgb2hsl(p[0], p[1], p[2]);
    if (s > .22 && l > .12 && l < .9) { bins[Math.floor(h / 15) % 24] += s; sat += s; }
  }
  let color = 0;
  if (sat > n * .04) {
    const hue = bins.indexOf(Math.max(...bins)) * 15 + 7.5;
    let bd = 1e9;
    COLORS.forEach((pair, i) => {
      const [ph] = rgb2hsl(...hex2rgb(pair[0]));
      const dd = Math.min(Math.abs(hue - ph), 360 - Math.abs(hue - ph));
      if (dd < bd) { bd = dd; color = i; }
    });
  }

  /* ears: spikes at the crown */
  const crown = span(y0, Y(.10)), headBand = span(y0, Y(.26));
  let ears = "cat";
  if (crown.runs.length >= 2) {
    const tallNarrow = crown.runs.every(r => r.w < bw * .16);
    ears = tallNarrow && bh * .10 > bw * .10 ? "long" : "cat";
  } else if (crown.runs.length === 1 && crown.runs[0].w > bw * .34) ears = "round";
  else if (crown.runs.length === 0) ears = "round";

  /* the head sets the scale; the torso is a fixed multiple of it, so wings are
     whatever sticks out beyond that */
  const hw = Math.max(headBand.w, bw * .12);
  const core = hw * 1.35;
  const mid = span(Y(.30), Y(.58));
  let wings = "none";
  if (mid.w > core * 1.55) {
    const raw = mid.cols, sm = raw.map((_, i) =>
      (raw[Math.max(0, i - 1)] + raw[i] + raw[Math.min(raw.length - 1, i + 1)]) / 3);
    const mx = Math.max(...sm, 1);
    let peaks = 0, up = false;
    for (let i = 1; i < sm.length; i++) {
      if (!up && sm[i] > mx * .62) { peaks++; up = true; }
      else if (up && sm[i] < mx * .40) up = false;
    }
    wings = peaks >= 5 ? "b5" : (peaks >= 3 ? "b3" : (mid.w > core * 2.6 ? "bat" : "b3"));
  }

  /* body: four ground contacts means it stands on all fours */
  const floor = span(Y(.88), y1);
  let body = "round";
  const ratio = (bh * .42) / core;
  if (floor.runs.length >= 3) body = "quad";
  else if (ratio > 1.5) body = "slim";
  else if (ratio < .85) body = "stocky";

  /* tail: ink low and off to one side */
  const low = span(Y(.62), Y(.86));
  const tail = low.runs.length >= 3 ? "long" : (low.w > core * 1.6 ? "fluff" : "stub");

  /* paws: narrow spikes at the floor read as claws */
  const paws = floor.runs.length >= 2 && floor.runs[0].w < bw * .12 ? "claw" : "pad";

  const boxes = [
    { x: headBand.lo < 0 ? x0 : headBand.lo, y: y0, w: headBand.w || bw, h: Y(.26) - y0, c: "#2E9BE6" },
    { x: mid.lo < 0 ? x0 : mid.lo, y: Y(.30), w: mid.w || bw, h: Y(.56) - Y(.30), c: "#9B4FD6" },
    { x: low.lo < 0 ? x0 : low.lo, y: Y(.62), w: low.w || bw, h: y1 - Y(.62), c: "#FFC531" }
  ].map(b => ({ x: b.x / W2 * 100, y: b.y / H2 * 100, w: b.w / W2 * 100, h: b.h / H2 * 100, c: b.c }));

  return { cfg: { body, ears, wings, paws, tail, color }, boxes };
}

function openScan(img, dataURL) {
  const done = r => {
    const cv2 = $("#scanCv"), k = Math.min(320 / img.width, 320 / img.height, 1);
    cv2.width = Math.round(img.width * k); cv2.height = Math.round(img.height * k);
    cv2.getContext("2d").drawImage(img, 0, 0, cv2.width, cv2.height);
    $("#scanBoxes").innerHTML = (r.boxes || []).map((b, i) =>
      `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="2" stroke="${b.c}" stroke-width="1.4"
        vector-effect="non-scaling-stroke" fill="${b.c}" fill-opacity=".10" style="animation-delay:${.55 + i * .42}s"/>`).join("");
    const out = $("#scanOut");
    out.innerHTML = ""; out.classList.remove("in");
    const preview = { ...state.cfg, ...r.cfg };
    setTimeout(() => {
      out.innerHTML = `<svg viewBox="20 20 200 268" preserveAspectRatio="xMidYMid meet">${creature2D(preview, false)}</svg>`;
      out.classList.add("in"); sWin();
    }, RM ? 60 : 2000);
    setTimeout(() => {
      pushHistory();
      state.cfg = preview;
      state.ref = { src: dataURL, ghost: true };
      makeCutout(dataURL).then(r => {
        if (!state.ref || state.ref.src !== dataURL || !r.cuts.length) return;
        Object.assign(state.ref, { cuts: r.cuts, colors: r.colors, pick: 0, figure: true });
        pickFigure(0, true);
      });
      refresh(); closeScan();
    }, RM ? 400 : 3300);
  };
  $("#scan").hidden = false;
  const ln = $("#scanLine"); ln.style.animation = "none"; void ln.offsetWidth; ln.style.animation = "";
  sPick();
  if (typeof window.RF_ANALYZE === "function")
    Promise.resolve(window.RF_ANALYZE(img)).then(cfg => done({ cfg, boxes: [] })).catch(() => done(analyzeDrawing(img)));
  else done(analyzeDrawing(img));
}

/* ============================================================
   8b. RECORDING → CONFIG
   An interview clip is dropped in whole. What can be measured
   without a recogniser is measured here: speech rate, loudness,
   pause ratio and pitch spread drive the four personality traits.
   The words themselves need ASR — wire window.RF_AUDIO (returns
   {text}) or call window.RF_SENTENCE(text) straight from the
   service, and the sentence is parsed into parts, colour and scene.
   ============================================================ */
let sndURL = null, sndAudio = null, sndTraits = null, sndWave = [], sndPlaying = false;

function mapTo01(v, lo, hi) { return clamp((v - lo) / (hi - lo), .05, .97); }

async function analyzeAudio(file) {
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const ab = await ac.decodeAudioData(await file.arrayBuffer());
  const d = ab.getChannelData(0), sr = ab.sampleRate;
  const hop = Math.round(sr * .02), n = Math.floor(d.length / hop);
  const rms = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let sum = 0;
    for (let k = i * hop; k < (i + 1) * hop; k++) sum += d[k] * d[k];
    rms[i] = Math.sqrt(sum / hop);
  }
  const peak = Math.max(...rms) || 1e-6;
  const thr = peak * .16;
  const voiced = [];
  for (let i = 0; i < n; i++) if (rms[i] > thr) voiced.push(i);
  const voicedRatio = voiced.length / Math.max(1, n);
  const dur = ab.duration;

  /* syllable-rate proxy: energy onsets, at least 110 ms apart */
  let onsets = 0, lastOn = -99;
  for (let i = 1; i < n; i++)
    if (rms[i - 1] <= thr && rms[i] > thr && i - lastOn > 5.5) { onsets++; lastOn = i; }
  const voicedSec = Math.max(.4, voiced.length * .02);
  const rate = onsets / voicedSec;

  const mean = voiced.reduce((a, i) => a + rms[i], 0) / Math.max(1, voiced.length);
  const varc = Math.sqrt(voiced.reduce((a, i) => a + (rms[i] - mean) ** 2, 0) / Math.max(1, voiced.length)) / (mean || 1e-6);

  /* pitch spread over a sample of voiced frames (autocorrelation, 110–520 Hz) */
  const f0 = [];
  for (let s2 = 0; s2 < voiced.length; s2 += Math.max(1, Math.floor(voiced.length / 40))) {
    const st = voiced[s2] * hop, len = Math.min(Math.round(sr * .04), d.length - st);
    if (len < sr * .02) continue;
    let best = 0, bestLag = 0;
    for (let lag = Math.floor(sr / 520); lag <= Math.floor(sr / 110) && lag < len; lag++) {
      let acc = 0;
      for (let k = 0; k + lag < len; k += 2) acc += d[st + k] * d[st + k + lag];
      if (acc > best) { best = acc; bestLag = lag; }
    }
    if (bestLag) f0.push(sr / bestLag);
  }
  let spread = 1;
  if (f0.length > 3) {
    const lg = f0.map(v => Math.log2(v) * 12);
    const m = lg.reduce((a, b) => a + b, 0) / lg.length;
    spread = Math.sqrt(lg.reduce((a, b) => a + (b - m) ** 2, 0) / lg.length);
  }

  /* waveform bars for the card */
  const bars = 200, step = Math.max(1, Math.floor(n / bars));
  sndWave = [];
  for (let i = 0; i < n; i += step) {
    let mx = 0;
    for (let k = i; k < Math.min(n, i + step); k++) mx = Math.max(mx, rms[k]);
    sndWave.push(mx / peak);
  }

  try { ac.close(); } catch (e) {}
  return {
    dur,
    traits: {
      speed:   mapTo01(rate, 1.8, 6.0),
      bounce:  mapTo01(varc, .28, 1.05),
      bold:    mapTo01(mean / peak * .6 + voicedRatio * .4, .18, .62),
      curious: mapTo01(spread, .6, 4.2)
    }
  };
}

/* one sentence -> as much of the build as it actually names */
function applySentence(text) {
  const t = String(text || "");
  if (!t.trim()) return {};
  const hit = {};
  pushHistory();
  state.cfg.custom = { ...(state.cfg.custom || {}) };
  for (const cat of ["body", "ears", "wings", "paws", "tail", "face"]) {
    const words = (PART_LEX[cat] || []).flatMap(e => e[1]);
    if (words.some(w => t.toLowerCase().includes(w))) {
      state.cfg[cat] = partFromText(cat, t);
      state.cfg.custom[cat] = t;
      hit[cat] = state.cfg[cat];
    }
  }
  if (COLOR_LEX.some(([, ws]) => ws.some(w => t.toLowerCase().includes(w))) || /#[0-9a-f]{6}/i.test(t)) {
    state.cfg.customColor = colorsFromText(t);
    state.cfg.color = "custom";
    state.cfg.custom.color = t;
    hit.color = state.cfg.customColor;
  }
  for (const e of SLEX) if (e.w.some(w => t.toLowerCase().includes(w))) {
    state.scene = "custom"; state.sceneText = t; state.customScene = { ...e.s };
    reseedStars(); renderScenes(); hit.scene = t; break;
  }
  state.cfg.mood = "custom"; state.cfg.moodText = t; state.cfg.traits = traitsFromText(t);
  hit.traits = state.cfg.traits;
  refresh();
  return hit;
}
window.RF_SENTENCE = applySentence;

function drawWave(progress) {
  const c = $("#waveCv"), r = c.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = r.width * dpr; c.height = r.height * dpr;
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W2 = r.width, H2 = r.height, mid = H2 * .46;
  const cs = getComputedStyle(document.documentElement);
  const on = cs.getPropertyValue("--chipc").trim() || "#2E9BE6";
  const off = cs.getPropertyValue("--line").trim() || "#C4D1DC";
  const n = sndWave.length || 1, bw = W2 / n;
  for (let i = 0; i < n; i++) {
    const h = Math.max(2, sndWave[i] * H2 * .62);
    x.fillStyle = (i / n) <= progress ? on : off;
    x.beginPath();
    x.roundRect(i * bw + bw * .18, mid - h / 2, Math.max(1, bw * .64), h, bw * .32);
    x.fill();
  }
}

function openSnd(file) {
  if (sndURL) URL.revokeObjectURL(sndURL);
  sndURL = URL.createObjectURL(file);
  sndAudio = new Audio(sndURL);
  sndAudio.addEventListener("timeupdate", () => drawWave(sndAudio.currentTime / (sndAudio.duration || 1)));
  sndAudio.addEventListener("ended", () => { sndPlaying = false; $("#playBtn").innerHTML = UI.play; drawWave(1); });
  $("#snd").hidden = false;
  $("#sndOut").innerHTML = ""; $("#sndOut").classList.remove("in");
  $("#playBtn").innerHTML = UI.play;
  sndWave = new Array(120).fill(.1); drawWave(0);
  sPick();

  const finish = (traits, text) => {
    sndTraits = traits;
    renderTraits($("#sndTraits"), traits);
    setTimeout(() => {
      state.cfg.traits = { ...traits };
      state.cfg.mood = "custom";
      if (text) applySentence(text); else refresh();
      state.audio = { src: sndURL, text: text || "" };
      drawStage();
      $("#sndOut").innerHTML =
        `<svg viewBox="20 20 200 268" preserveAspectRatio="xMidYMid meet">${creature2D(state.cfg, false)}</svg>`;
      $("#sndOut").classList.add("in");
      sWin();
    }, RM ? 60 : 900);
  };

  analyzeAudio(file).then(r => {
    drawWave(0);
    if (typeof window.RF_AUDIO === "function")
      Promise.resolve(window.RF_AUDIO(file)).then(o => finish(o && o.traits ? o.traits : r.traits, o && o.text))
        .catch(() => finish(r.traits));
    else finish(r.traits);
  }).catch(() => {
    /* a codec the browser can't decode (WeChat .amr/.silk): keep the clip, skip the analysis */
    sndWave = new Array(120).fill(.12); drawWave(0);
    renderTraits($("#sndTraits"), TR());
    state.audio = { src: sndURL, text: "" };
    drawStage(); sFail();
  });
}
function closeSnd() {
  if (sndAudio) { sndAudio.pause(); }
  sndPlaying = false;
  $("#snd").hidden = true;
}

  if (!CATS.includes(state.cat)) state.cat = CATS[0];
  document.documentElement.dataset.species = sp;
}

      for (let i = 0, o = 0; i < w * h; i++, o += 4) {
        const dist = Math.hypot(p[o] - br, p[o + 1] - bg, p[o + 2] - bb);
        const mx = Math.max(p[o], p[o + 1], p[o + 2]), mn = Math.min(p[o], p[o + 1], p[o + 2]);
        wm[i] = (mn > 150 && mx - mn < 80 && p[o + 1] === mx && p[o + 1] - p[o] > 10) ? 1 : 0;
        bgl[i] = (dist < 42 || wm[i]) ? 1 : 0;
        ramp[i] = dist < 42 ? 0 : dist < 70 ? Math.round((dist - 42) / 28 * 255) : 255;
      }
      /* only background reachable from the picture's edge is removed; enclosed white (a white body) stays */
      const outside = new Uint8Array(w * h), fq = [];
      for (let i = 0; i < w; i++) { fq.push(i, (h - 1) * w + i); }
      for (let j = 0; j < h; j++) { fq.push(j * w, j * w + w - 1); }
      while (fq.length) {
        const q = fq.pop();
        if (outside[q] || !bgl[q]) continue;
        outside[q] = 1;
        const qx = q % w;
        if (qx > 0) fq.push(q - 1); if (qx < w - 1) fq.push(q + 1);
        if (q >= w) fq.push(q - w); if (q < (h - 1) * w) fq.push(q + w);
      }
      const mask = new Uint8Array(w * h);
      for (let i = 0, o = 0; i < w * h; i++, o += 4) {
        if (outside[i]) { p[o + 3] = 0; continue; }
        if (wm[i]) { p[o] = br; p[o + 1] = bg; p[o + 2] = bb; }   /* watermark inside a figure -> paper colour */
        /* soft edge: a background-like pixel touching the outside fades out */
        const qx = i % w, edge = (qx > 0 && outside[i - 1]) || (qx < w - 1 && outside[i + 1]) || (i >= w && outside[i - w]) || (i < (h - 1) * w && outside[i + w]);
        p[o + 3] = edge ? Math.max(ramp[i], 90) : 255;
        mask[i] = 1;
      }
      /* label connected shapes */
      const lab = new Int32Array(w * h), comps = [null]; let id = 0;
      const st = [];
      for (let i = 0; i < w * h; i++) {
        if (!mask[i] || lab[i]) continue;
        id++; const cp = { n: 0, x0: w, y0: h, x1: 0, y1: 0 }; st.push(i); lab[i] = id;
        while (st.length) {
          const q = st.pop(); cp.n++;
          const qx = q % w, qy = (q - qx) / w;
          if (qx < cp.x0) cp.x0 = qx; if (qx > cp.x1) cp.x1 = qx; if (qy < cp.y0) cp.y0 = qy; if (qy > cp.y1) cp.y1 = qy;
          if (qx > 0 && mask[q - 1] && !lab[q - 1]) { lab[q - 1] = id; st.push(q - 1); }
          if (qx < w - 1 && mask[q + 1] && !lab[q + 1]) { lab[q + 1] = id; st.push(q + 1); }
          if (qy > 0 && mask[q - w] && !lab[q - w]) { lab[q - w] = id; st.push(q - w); }
          if (qy < h - 1 && mask[q + w] && !lab[q + w]) { lab[q + w] = id; st.push(q + w); }
        }
        comps.push(cp);
      }
      /* pieces close to each other (separate strokes, a claw split from the body) form one figure */
      const bigN = Math.max(1, ...comps.slice(1).map(cp => cp.n));
      const parts = comps.map((cp, i) => i && cp.n >= bigN * .02 ? { ids: [i], ...cp } : null).filter(Boolean);
      const gap = Math.max(w, h) * .035;
      for (let merged = true; merged;) {
        merged = false;
        for (let a1 = 0; a1 < parts.length && !merged; a1++) for (let b1 = a1 + 1; b1 < parts.length; b1++) {
          const A = parts[a1], Bp = parts[b1];
          if (A.x0 - gap <= Bp.x1 && Bp.x0 - gap <= A.x1 && A.y0 - gap <= Bp.y1 && Bp.y0 - gap <= A.y1) {
            A.ids.push(...Bp.ids); A.n += Bp.n;
            A.x0 = Math.min(A.x0, Bp.x0); A.y0 = Math.min(A.y0, Bp.y0); A.x1 = Math.max(A.x1, Bp.x1); A.y1 = Math.max(A.y1, Bp.y1);
            parts.splice(b1, 1); merged = true; break;
          }
        }
      }
      const big = Math.max(1, ...parts.map(f => f.n));
      const figs = parts.filter(f => f.n >= big * .3);
      const owner = new Int32Array(comps.length);
      figs.forEach((f, k) => f.ids.forEach(id => { owner[id] = k + 1; }));
      if (!figs.length) { resolve({ cuts: [], colors: [] }); return; }
      const rowH = Math.max(...figs.map(f => f.y1 - f.y0)) * .5;
      figs.sort((a, b) => Math.round(a.y0 / rowH) - Math.round(b.y0 / rowH) || a.x0 - b.x0);
      x.putImageData(d, 0, 0);
      const cuts = [], colors = [];
      for (const [fk, f] of figs.entries()) {
        const fw = f.x1 - f.x0 + 1, fh = f.y1 - f.y0 + 1;
        const oc = document.createElement("canvas"); oc.width = fw; oc.height = fh;
        const ox = oc.getContext("2d"); ox.drawImage(c, f.x0, f.y0, fw, fh, 0, 0, fw, fh);
        const od = ox.getImageData(0, 0, fw, fh), op = od.data;
        const hist = Array.from({ length: 12 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
        for (let yy = 0; yy < fh; yy++) for (let xx = 0; xx < fw; xx++) {
          const gi = (f.y0 + yy) * w + f.x0 + xx, oi = (yy * fw + xx) * 4;
          const L = lab[gi];
          /* keep only this figure's pieces (plus tiny bits inside them, e.g. eyes) */
          if (owner[L] !== fk + 1) { op[oi + 3] = 0; continue; }
          if (op[oi + 3] < 200) continue;
          const r = op[oi], g = op[oi + 1], b = op[oi + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          const sat = mx ? (mx - mn) / mx : 0;
          if (sat < .35 || mx < 70) continue;
          let hh = 0;
          if (mx === r) hh = ((g - b) / (mx - mn) + 6) % 6; else if (mx === g) hh = (b - r) / (mx - mn) + 2; else hh = (r - g) / (mx - mn) + 4;
          const bin = hist[Math.floor(hh * 2) % 12]; bin.w += sat; bin.r += r * sat; bin.g += g * sat; bin.b += b * sat;
        }
        ox.putImageData(od, 0, 0);
        cuts.push(oc.toDataURL("image/png"));
        const top = hist.map((b0, i) => ({ ...b0, i })).filter(b0 => b0.w > 0).sort((a, b) => b.w - a.w);
        const hexOf = b0 => "#" + [b0.r, b0.g, b0.b].map(v => Math.round(v / b0.w).toString(16).padStart(2, "0")).join("");
        colors.push(top.length ? [hexOf(top[0]), hexOf(top[1] || top[0])] : null);
      }
      resolve({ cuts, colors });
    };
    im.onerror = () => resolve({ cuts: [], colors: [] });
    im.src = src;
  });
}

$("#bUndo").innerHTML = UI.undo; $("#bDice").innerHTML = UI.dice;
$("#bSave").innerHTML = UI.star; $("#bSound").innerHTML = UI.sndOn;
$("#spinHint").innerHTML = UI.rotate;
/* scene full size: the preview pane fills the page, actions stay at the bottom; Esc or the button closes it */
const EXPAND = S("0 0 24 24", `<path d="M14.5 4H20v5.5M9.5 20H4v-5.5M20 4l-6.5 6.5M4 20l6.5-6.5"/>`);
const SHRINK = S("0 0 24 24", `<path d="M19.5 9.5H14V4M4.5 14.5H10V20M14 10l6-6M10 14l-6 6"/>`);
function setSceneMax(on) {
  document.body.classList.toggle("scene-max", on);
  const b = $("#viewMax");
  b.innerHTML = on ? SHRINK : EXPAND;
  b.setAttribute("aria-label", on ? "close the full-size scene" : "open the scene full size");
  b.setAttribute("aria-pressed", on);
  resize(); sTap();
}
$("#viewMax").innerHTML = EXPAND;
$("#viewMax").addEventListener("click", e => { e.stopPropagation(); setSceneMax(!document.body.classList.contains("scene-max")); });
$("#viewMax").addEventListener("pointerdown", e => e.stopPropagation());
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("scene-max")) setSceneMax(false); });
$("#bUndo").addEventListener("click", () => {
  if (!state.history.length) { sFail(); return; }
  state.cfg = state.history.pop(); refresh(); sTap();
});
$("#bDice").addEventListener("click", () => {
  pushHistory();
  if (SPECIES[spOf(state.cfg)].photo) {
    const sp = spOf(state.cfg), c = state.cfg, n = PHOTO_ART[sp].looks.length;
    c.look = Math.floor(Math.random() * n);
    if (sp === "crab") c.tint = CRAB_TINTS[Math.floor(Math.random() * CRAB_TINTS.length)].id;
    const ms = Object.keys(MOODS); c.mood = ms[Math.floor(Math.random() * ms.length)];
    c.moodText = ""; c.traits = { ...MOODS[c.mood] };
    c.phrase = ["", ...PHRASES][Math.floor(Math.random() * (PHRASES.length + 1))];
    applyPhotoColor(); refresh(); sPick(); return;
  }
  for (const c of Object.keys(OPTS)) {
    if (c === "mood") continue;
    const pool = OPTS[c].filter(o => o !== "custom");
    state.cfg[c] = pool[Math.floor(Math.random() * pool.length)];
  }
  const ms = Object.keys(MOODS);
  state.cfg.mood = ms[Math.floor(Math.random() * ms.length)];
  state.cfg.moodText = ""; state.cfg.traits = { ...MOODS[state.cfg.mood] };
  state.cfg.color = Math.floor(Math.random() * COLORS.length);
  state.cfg.customColor = null; state.cfg.custom = {};
  state.cfg.phrase = ["", ...PHRASES][Math.floor(Math.random() * (PHRASES.length + 1))];
  refresh(); sPick();
});
$("#bSave").addEventListener("click", () => {
  state.gallery.unshift(JSON.parse(JSON.stringify(state.cfg)));
  if (state.gallery.length > 12) state.gallery.pop();
  saveGallery(); renderGallery(); sWin();
});
$("#bSound").addEventListener("click", e => {
  state.sound = !state.sound;
  e.currentTarget.innerHTML = state.sound ? UI.sndOn : UI.sndOff;
  e.currentTarget.dataset.off = state.sound ? "0" : "1";
  if (state.sound) sTap();
});
function saveGallery() { try { localStorage.setItem("cf.gallery", JSON.stringify(state.gallery)); } catch (e) {} }
function loadGallery() {
  try {
    const v = JSON.parse(localStorage.getItem("cf.gallery") || "[]");
    if (Array.isArray(v)) state.gallery = v.filter(x => x && x.body).slice(0, 12);
  } catch (e) { state.gallery = []; }
}

/* ============================================================
   8b. PANEL BRIDGE  (v0.2)
   The Spark panel embeds this page in a sandboxed iframe. Messages, parent -> page:
     {type:"unbound:request-color"}   -> {type:"unbound:concept-color", color:"#RRGGBB"}   (as v0.1)
     {type:"unbound:request-config"}  -> {type:"unbound:concept-config", config:{...}}
   After the first request the page also pushes "unbound:concept-config" on every change.
   Replies go to the parent's origin, never "*". Only messages from window.parent are read.
   ============================================================ */
const hex6 = c => "#" + hex2rgb(c).map(v => v.toString(16).padStart(2, "0")).join("");
function exportConfig() {
  const c = state.cfg, T = TR(), [bc, wc] = CPAIR();
  const r2 = v => Math.round(v * 100) / 100;
  return {
    schema: "unbound-concept/0.2",
    wings: SPECIES[spOf(c)].opts.wings ? c.wings : undefined,
    catchphrase: c.phrase || "",
    battery: { level: c.battery, percent: BATT_PCT[c.battery] },
    personality: {
      tags: [...(c.tags || [])], mood: c.mood,
      traits: { speed: r2(T.speed), bounce: r2(T.bounce), bold: r2(T.bold), curious: r2(T.curious) }
    },
    color: { body: hex6(bc), wings: hex6(wc) },
    species: spOf(c),
    parts: Object.fromEntries(Object.keys(SPECIES[spOf(c)].defaults).map(k => [k, c[k]]).concat([["face", c.face]]))
  };
}
window.RF_CONFIG = exportConfig;

let parentOrigin = null, notifyTimer = 0;
function toParent(msg) {
  if (window.parent === window || !parentOrigin) return;
  try { window.parent.postMessage(msg, parentOrigin); } catch (e) {}
}
function notifyParent() {
  if (!parentOrigin) return;
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => toParent({ type: "unbound:concept-config", config: exportConfig() }), 120);
}
window.addEventListener("message", e => {
  if (window.parent === window || e.source !== window.parent) return;
  const d = e.data;
  if (!d || typeof d.type !== "string") return;
  if (d.type !== "unbound:request-color" && d.type !== "unbound:request-config") return;
  parentOrigin = e.origin && e.origin !== "null" ? e.origin : null;
  if (!parentOrigin) return;
  if (d.type === "unbound:request-color") toParent({ type: "unbound:concept-color", color: hex6(CPAIR()[0]) });
  else toParent({ type: "unbound:concept-config", config: exportConfig() });
});

/* ============================================================
   9.  BOOT
   ============================================================ */
loadGallery();
refresh(); renderScenes(); renderMissions(); renderGallery(); reseedStars(); resize();

let last = performance.now();
function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  tSec = t / 1000;
  if (run) stepMission(dt);
  else {
    const T = TR(), S2 = SC(), gk = 1 / Math.max(.20, S2.g === 0 ? .25 : S2.g);
    act.x = RM ? 0 : Math.sin(tSec * .5) * .05 * T.curious;
    act.y = RM ? 0 : (S2.g === 0 ? .16 + Math.sin(tSec * .8) * .04 : 0)
                     + T.bounce * .035 * gk * Math.abs(Math.sin(tSec * (1.5 + T.speed * 2.4)));
    act.rot = RM ? 0 : T.curious * .05 * Math.sin(tSec * .85) - (1 - T.bold) * .05;
    act.s = 1;
  }
  const wantPhoto = (state.scene === "grass" && !run && isReference()) ? 1 : 0;
  photoA += (wantPhoto - photoA) * Math.min(1, dt * 4.5);
  if (!drag) pTarget *= .985;
  parallax += (pTarget - parallax) * Math.min(1, dt * 4);
  drawPreview();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => drawPreview());
})();
