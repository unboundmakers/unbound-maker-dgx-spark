<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>概念预览（桩）</title><style>
body{margin:0;min-height:100vh;font-family:"PingFang SC",sans-serif;background:linear-gradient(180deg,#141d3d,#31427a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
h2{margin:0;font-size:16px;font-weight:600}
.palette{display:flex;gap:10px}
.palette button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer}
svg{filter:drop-shadow(0 8px 24px rgba(0,0,0,.35))}
</style></head>
<body>
<h2>我的飞行猫（概念页桩）</h2>
<svg viewBox="0 0 300 250" width="320" role="img" aria-label="飞行猫概念图">
  <polygon points="105,120 30,60 70,130" fill="#8ea2e8"/>
  <polygon points="195,120 270,60 230,130" fill="#8ea2e8"/>
  <path d="M 205 160 Q 260 180 245 215" stroke="#F2A65A" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse id="body" cx="150" cy="155" rx="62" ry="44" fill="#F2A65A"/>
  <circle cx="150" cy="92" r="42" fill="#F2A65A"/>
  <polygon points="122,62 130,30 146,58" fill="#F2A65A"/>
  <polygon points="154,58 170,30 178,62" fill="#F2A65A"/>
  <circle cx="135" cy="88" r="7" fill="#23283b"/>
  <circle cx="165" cy="88" r="7" fill="#23283b"/>
  <circle cx="137" cy="86" r="2" fill="#fff"/>
  <circle cx="167" cy="86" r="2" fill="#fff"/>
  <path d="M 145 105 Q 150 110 155 105" stroke="#23283b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
<div class="palette">
  <button data-color="#F2A65A" style="background:#F2A65A" aria-label="橘色"></button>
  <button data-color="#2867D7" style="background:#2867D7" aria-label="蓝色"></button>
  <button data-color="#E8513D" style="background:#E8513D" aria-label="红色"></button>
  <button data-color="#23775C" style="background:#23775C" aria-label="绿色"></button>
  <button data-color="#B088D8" style="background:#B088D8" aria-label="紫色"></button>
</div>
<script>
document.querySelectorAll('.palette button').forEach((b) => b.addEventListener('click', () => {
  document.getElementById('body').setAttribute('fill', b.dataset.color);
}));
</script>
</body></html>
